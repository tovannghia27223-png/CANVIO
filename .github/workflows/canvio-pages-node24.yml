name: CANVIO Pages — manual P70 certification gate

on:
  workflow_dispatch:
    inputs:
      deploy_candidate:
        description: Deploy only when all fourteen P70 gates are independently certified
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: canvio-pages-certified
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    outputs:
      certified: ${{ steps.check.outputs.certified }}
    steps:
      - name: Checkout certified candidate metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Require all P70 real-world evidence before deployment
        id: check
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('CANVIO_MANIFEST.json','utf8'));
          const g=m.p70ManualGates||{};
          const evidence=Array.isArray(m.manualGateEvidence)?m.manualGateEvidence:[];
          const certified=m.releaseCertified===true && m.releaseStatus==='CERTIFIED' && g.total===14 && g.pending===0 && g.passed===14 && evidence.length===14 && evidence.every(x=>x&&x.reviewed===true&&x.evidence);
          console.log(JSON.stringify({certified,releaseCertified:m.releaseCertified,releaseStatus:m.releaseStatus,gates:g,evidenceCount:evidence.length},null,2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'certified='+(certified?'true':'false')+'\n');
          if(!certified) console.log('Deployment blocked: all fourteen independently reviewed P70 evidence records are required.');
          NODE

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_candidate == true && needs.release-gate.outputs.certified == 'true' }}
    needs: release-gate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          test -d assets && cp -a assets _site/assets
          test -s _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

      - name: Deploy certified candidate
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
