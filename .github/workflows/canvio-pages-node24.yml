name: CANVIO 23.3.108 P85 Creative Runtime candidate validation (Node 24)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_candidate:
        description: "Explicitly authorize deployment after reviewing all release gates"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: canvio-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package CANVIO 23.3.108 P85 Creative Runtime candidate
    runs-on: ubuntu-latest
    outputs:
      release_certified: ${{ steps.release_gate.outputs.release_certified }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - name: Provision the pinned local PDF font from the runner package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          mkdir -p assets/pdf-fonts
          cp /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf assets/pdf-fonts/NotoSans-Regular.ttf
          actual="$(sha256sum assets/pdf-fonts/NotoSans-Regular.ttf | cut -d' ' -f1)"
          expected="89c3c497f618fdaa0b2d1e98fef93582f28c71debd2c4a8cdf41f190ced2909d"
          test "$actual" = "$expected" || { echo "Unexpected Noto Sans font hash: $actual" >&2; exit 1; }
          test -s assets/pdf-fonts/OFL.txt
          echo "Pinned Noto Sans Regular font verified: $actual"

      - name: Provision pinned free Three.js r187 + Draco/Meshopt/KTX2 assets
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/vendor-three-r187.sh
          test -s assets/three/build/three.module.js
          test -s assets/three/build/three.core.js
          test -s assets/three/examples/jsm/libs/draco/gltf/draco_decoder.wasm
          test -s assets/three/examples/jsm/libs/meshopt_decoder.module.js
          test -s assets/three/examples/jsm/libs/basis/basis_transcoder.wasm
          test -s assets/three/THREE-VENDOR-MANIFEST.json
          node --check assets/three/examples/jsm/libs/meshopt_decoder.module.js

      - name: Provision pinned free P85 renderer, OpenCV, dotLottie and Rive runtimes
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/vendor-p85-runtimes.sh
          test -s assets/p85/p85-renderers.js
          test -s assets/p85/opencv/opencv.js
          test -s assets/p85/dotlottie/index.js
          test -s assets/p85/dotlottie/dotlottie-player.wasm
          test -s assets/p85/rive/rive.js
          test -s assets/p85/rive/rive.wasm
          test -s assets/p85/P85-VENDOR-MANIFEST.json
          node --input-type=module --check < assets/p85/p85-renderers.js
          node --input-type=module --check < assets/p85/dotlottie/index.js
          node --input-type=module --check < assets/p85/opencv/opencv.js
          node -e "const m=require('./assets/p85/P85-VENDOR-MANIFEST.json'); if(m.format!=='CANVIO_P85_VENDOR_MANIFEST'||!m.files.length) process.exit(1); console.log('P85 vendor manifest PASS:',m.files.length,'files')"
          test -s assets/p85/transformers/transformers.min.js
          test -n "$(find assets/p85/transformers -maxdepth 1 -type f -name 'ort-wasm*.wasm' -print -quit)"
          test -n "$(find assets/p85/transformers -maxdepth 1 -type f -name 'ort-wasm*.mjs' -print -quit)"

      - name: Verify exact CANVIO 23.3.108 integration candidate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum index.html | cut -d' ' -f1)"
          expected_candidate="1736457b13aa9db40d847ea065ea521328d247709664dde6b1d3781088869b82" # Pin is refreshed after the final source/docs change.
          test "$actual" = "$expected_candidate" || { echo "Unexpected candidate index.html SHA-256: $actual" >&2; exit 1; }
          echo "Exact CANVIO 23.3.108 candidate SHA-256 verified: $actual"

      - name: Validate HTML, unique IDs, and inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          from pathlib import Path
          import re, subprocess, tempfile, sys

          source = Path("index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.scripts = 0
                  self.external_scripts = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.append(attrs["id"])
                  if tag.lower() == "script":
                      self.scripts += 1
                      if attrs.get("src"):
                          self.external_scripts.append(attrs["src"])

          audit = Audit()
          audit.feed(source)
          ids = Counter(audit.ids)
          duplicates = [key for key, count in ids.items() if count > 1]
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script\s*>", source, re.I)
          if audit.scripts != len(scripts):
              raise SystemExit(f"HTML parser/script extraction mismatch: parser={audit.scripts}, extracted={len(scripts)}")
          if audit.external_scripts:
              raise SystemExit(f"Unexpected external script src entries: {audit.external_scripts}")
          if duplicates:
              raise SystemExit(f"Duplicate HTML IDs: {duplicates[:20]}")
          if not audit.ids or len(ids) != len(audit.ids):
              raise SystemExit(f"ID uniqueness check failed: found {len(audit.ids)} IDs / {len(ids)} unique")

          failures = []
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts):
                  path = Path(directory) / f"inline-{index}.js"
                  path.write_text(script, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(path)], capture_output=True, text=True)
                  if result.returncode:
                      failures.append((index, result.stderr))
          if failures:
              for index, error in failures:
                  print(f"Inline script {index} failed:\n{error}", file=sys.stderr)
              raise SystemExit(f"{len(failures)} inline JavaScript syntax error(s)")
          print(f"PASS: {audit.scripts} inline scripts; 0 external script src; {len(audit.ids)} IDs / {len(ids)} unique / 0 duplicates; Node syntax {len(scripts)}/{len(scripts)}.")
          PY

          python3 tests/release/run-static-audit.py
          mkdir -p _site/assets
          cp index.html _site/index.html
          for worker in canvio-whisper-worker.js canvio-rmbg-worker.js canvio-depth-worker.js; do
            test -f "assets/$worker"
            node --check "assets/$worker"
            cp "assets/$worker" "_site/assets/$worker"
          done
          mkdir -p _site/assets/pdf-fonts
          cp assets/pdf-fonts/NotoSans-Regular.ttf assets/pdf-fonts/OFL.txt _site/assets/pdf-fonts/
          cp assets/AI-MODEL-NOTICES.md _site/assets/AI-MODEL-NOTICES.md
          cp -a assets/three _site/assets/three
          cp -a assets/p85 _site/assets/p85
          node --check canvio-p82-p84-vector-pdf.js

      - name: Run P85 Creative Runtime source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check canvio-p85-studio.js
          node --check scripts/p85-renderers.entry.mjs
          node tests/p85/run-p85-contract-tests.cjs

      - name: Run P102/P105 shipped worker contract tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/p102-p105/run-worker-contract-tests.cjs

      - name: Run P107 portable preset ZIP security and Asset Library round-trip tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/p102-p105/run-p107-portable-preset-tests.cjs

      - name: Run P74/P81 pinned Three.js, GLB preflight and local decoder contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --check canvio-p74-p81-three-viewer.js
          node tests/p74-p81/run-p74-p81-contract-tests.cjs
          node -e "const m=require('./assets/three/THREE-VENDOR-MANIFEST.json'); if(m.revision!=='r187'||m.commit!=='7e89746a687bb88271253698fa108b1dd59825d0'||!m.files.length) process.exit(1); console.log('Three.js vendor manifest PASS:',m.files.length,'files')"

      - name: Run P47 integration and backup fixtures
        shell: bash
        run: |
          set -euo pipefail
          node tests/p47/test_phase_p47.cjs
          node tests/p47/test_p47_bezier.cjs
          node tests/p47/test_phase_p47_restore.cjs
          node tests/p47/test_phase_p47_crc.cjs

      - name: Run P48 track controls and WebVTT regression suite
        shell: bash
        run: |
          set -euo pipefail
          node tests/p48/run-p48-tests.cjs


      - name: Run P49 video export, subtitle QC and Whisper adapter suite
        shell: bash
        run: |
          set -euo pipefail
          node tests/p49/run-p49-tests.cjs

      - name: Run P50 production-control lifecycle regression suite
        shell: bash
        run: |
          set -euo pipefail
          node tests/p50/run-p50-tests.cjs

      - name: Run P55 P51–P55 stability and release-readiness regression suite
        shell: bash
        run: |
          set -euo pipefail
          node tests/p55/run-p55-tests.cjs

      - name: Run P56 ZIP archive integrity and restore preview suite
        shell: bash
        run: |
          set -euo pipefail
          node tests/p56/run-p56-tests.cjs

      - name: Run P57–P62 Phase 1 persistence, media, AI, accessibility and release-gate suite
        shell: bash
        run: |
          set -euo pipefail
          node tests/p57/run-p57-tests.cjs

      - name: Verify P63–P67 integrated source and standalone module stay synchronized
        shell: bash
        run: |
          set -euo pipefail
          node tests/p63-p67/verify-p63-p67-source.cjs
          node --check canvio-p63-p67.js

      - name: Run P63–P67 creative production source VM regression suite
        shell: bash
        run: |
          set -euo pipefail
          node tests/p63-p67/run-p63-p67-tests.cjs

      - name: Verify and test P68–P70 inherited offline/optimization/release gate
        shell: bash
        run: |
          set -euo pipefail
          node tests/p68-p70/verify-p68-p70-source.cjs
          node --check canvio-p68-p70.js
          node tests/p68-p70/run-p68-p70-tests.cjs
          node --check canvio-p90-p96.js
          node --check canvio-p97-p101.js
          node --check canvio-p104.js
          node --check canvio-p87-cv-docx.js

      - name: Install pinned Playwright Chromium for browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/canvio-playwright
          /tmp/canvio-playwright/bin/python -m pip install --disable-pip-version-check playwright==1.65.2
          /tmp/canvio-playwright/bin/python -m pip install --disable-pip-version-check pymupdf==1.26.7 pillow==12.3.0
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          /tmp/canvio-playwright/bin/python -m playwright install --with-deps chromium

      - name: Run P55 browser lifecycle and storage smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p55/run-p55-browser-smoke.py

      - name: Run P56 archive restore preview Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p56/run-p56-browser-smoke.py

      - name: Run P62 Phase 1 dashboard and fail-closed gate Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p62/run-p62-browser-smoke.py

      - name: Run P72/P73/P102/P103/P105-P107 browser API contract smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p72-p107/run-p72-p107-api-smoke.py

      - name: Run P74/P81 local Three.js r187 software-WebGL and GLB viewer smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p74-p81/run-p74-p81-browser-smoke.py

      - name: Run P105/P106 headless fallback and P107 portable ZIP round-trip smoke
        shell: bash
        env:
          CANVIO_HEADLESS: '1'
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p102-p105/run-p106-depth-render-smoke.py

      - name: Run P85 browser lazy-boot and no-network smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p85/run-p85-browser-smoke.py

      - name: Run P85 actual local vendor runtimes (PostFX, OpenCV, dotLottie and Rive WASM)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p85/run-p85-vendor-runtime-smoke.py

      - name: Run P106 SwiftShader WebGL shader/animation/WebM export smoke under Xvfb
        shell: bash
        env:
          CANVIO_HEADLESS: '0'
        run: |
          set -euo pipefail
          command -v xvfb-run
          xvfb-run -a /tmp/canvio-playwright/bin/python tests/p102-p105/run-p106-depth-render-smoke.py

      - name: Run P82 Vietnamese vector PDF Chromium and reader validation
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p82/run-p82-pdf-vector-smoke.py

      - name: Run inherited P63–P67 Chromium regression against the exact current candidate
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p63-p67/run-p63-p67-browser-smoke.py

      - name: Run P68–P70 offline viewer, performance audit and fail-closed release-gate Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p68-p70/run-p68-p70-browser-smoke.py

      - name: Export P70 fail-closed release decision for the deploy gate
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('tests/p68-p70/browser-smoke-report.json').read_text(encoding='utf-8'))
          summary = report.get('summary') or {}
          certified = (
              report.get('releaseCertified') is True
              and report.get('releaseStatus') == 'CERTIFIED'
              and summary.get('fail') == 0
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('release_certified=' + ('true' if certified else 'false') + '\n')
          print('P70 deploy authorization:', 'CERTIFIED' if certified else 'BLOCKED — fourteen real-world acceptance gates must be evidenced and approved')
          PY

      - name: Run P90–P96 UI/UX Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p90-p96/run-p90-p96-browser-smoke.py

      - name: Run P97–P101 and P104 Video/Ken Burns Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p97-p101/run-p97-p101-browser-smoke.py

      - name: Run P87 CV DOCX and ATS Chromium/OOXML smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p87/run-p87-browser-smoke.py

      - name: Run P88 existing PPTX serializer OOXML Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvio-playwright/bin/python tests/p88/run-p88-pptx-smoke.py

      - name: Refresh and verify the complete candidate delivery manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/release/build-manifest.py --candidate 23.3.108-p85-studio-r2 --base 23.3.107-p107-preset-v2-r2 --release-base 23.3.84-p70
          python3 tests/release/verify-manifest.py
          python3 tests/release/package-delivery.py --output /tmp/CANVIO_23.3.108-p85-studio-r2_FINAL_DELIVERY.zip

      - name: Upload complete final delivery package and test evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: CANVIO_23.3.108-p85-studio-r2_FINAL_DELIVERY-${{ github.run_number }}
          path: |
            /tmp/CANVIO_23.3.108-p85-studio-r2_FINAL_DELIVERY.zip
            /tmp/CANVIO_23.3.108-p85-studio-r2_FINAL_DELIVERY.zip.sha256
            CANVIO_MANIFEST.json
            tests/**/browser-smoke-report.json
            tests/**/p90-p96-browser-smoke-report.json
            tests/**/api-smoke-report.json
            tests/p74-p81/p74-p81-contract-report.json
            tests/p74-p81/p74-p81-browser-smoke-report.json
            tests/p102-p105/p106-depth-render-*-browser-smoke-report.json
            assets/three/THREE-VENDOR-NOTICE.md
            assets/three/THREE-VENDOR-MANIFEST.json
            assets/p85/P85-VENDOR-NOTICE.md
            assets/p85/P85-VENDOR-MANIFEST.json
            tests/p85/p85-contract-report.json
            tests/p85/p85-browser-smoke-report.json
            tests/p85/p85-vendor-runtime-browser-smoke-report.json
            tests/release/static-audit-report.json
            tests/office/libreoffice-roundtrip-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_candidate == true && needs.build.outputs.release_certified == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
