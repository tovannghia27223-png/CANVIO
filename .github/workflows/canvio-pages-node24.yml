name: CANVIO GitHub Pages (Node 24)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvio-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package CANVIO P42 R6
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify or apply reviewed CANVIO R6 patch
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum index.html | cut -d' ' -f1)"
          expected_r5="ed4a39f149151ee849416423c544a005fe0e4cf2f01b1c84027395a2c078a2b5"
          expected_r6="11d1ba5394ee315e97909fba5efd99adc09a412227a443c94a3e3fdddbfed9dd"

          if [ "$actual" = "$expected_r5" ]; then
            git apply --check --unidiff-zero patches/canvio-p42-r6.patch
            git apply --unidiff-zero patches/canvio-p42-r6.patch
            actual="$(sha256sum index.html | cut -d' ' -f1)"
          elif [ "$actual" = "$expected_r6" ]; then
            echo "R6 is already present; patch application safely skipped."
          else
            echo "Unexpected index.html SHA-256: $actual" >&2
            exit 1
          fi

          test "$actual" = "$expected_r6"
          echo "CANVIO R6 SHA-256 verified: $actual"

      - name: Validate HTML, unique IDs, and inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          from pathlib import Path
          import re, subprocess, tempfile, sys

          source = Path("index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.scripts = 0
                  self.external_scripts = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.append(attrs["id"])
                  if tag.lower() == "script":
                      self.scripts += 1
                      if attrs.get("src"):
                          self.external_scripts.append(attrs["src"])

          audit = Audit()
          audit.feed(source)
          ids = Counter(audit.ids)
          duplicates = [key for key, count in ids.items() if count > 1]
          scripts = re.findall(r"<script\b[^>]*>([\s\\S]*?)</script\s*>", source, re.I)
          if audit.scripts != 79 or len(scripts) != 79:
              raise SystemExit(f"Expected 79 inline script blocks; parser={audit.scripts}, extracted={len(scripts)}")
          if audit.external_scripts:
              raise SystemExit(f"Unexpected external script src entries: {audit.external_scripts}")
          if duplicates:
              raise SystemExit(f"Duplicate HTML IDs: {duplicates[:20]}")

          failures = []
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts):
                  path = Path(directory) / f"inline-{index}.js"
                  path.write_text(script, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(path)], capture_output=True, text=True)
                  if result.returncode:
                      failures.append((index, result.stderr))
          if failures:
              for index, error in failures:
                  print(f"Inline script {index} failed:\n{error}", file=sys.stderr)
              raise SystemExit(f"{len(failures)} inline JavaScript syntax error(s)")
          print(f"PASS: {audit.scripts} inline scripts; 0 external script src; {len(audit.ids)} IDs / {len(ids)} unique / 0 duplicates; Node syntax {len(scripts)}/{len(scripts)}.")
          PY

          mkdir -p _site
          cp index.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    # Fail closed: configure Pages Source = GitHub Actions first, then set
    # repository Actions variable CANVIO_ENABLE_PAGES_DEPLOY=true.
    if: github.event_name != 'pull_request' && vars.CANVIO_ENABLE_PAGES_DEPLOY == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
