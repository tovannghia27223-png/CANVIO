          function syncLot(id,path,required){
            const source=fs.readFileSync(path,'utf8').trim();
            if(!source)throw new Error('P159 empty standalone source: '+path);
            const open='<script id="'+id+'">',close='</script>',tag=open+'\r\n'+source.replace(/\r?\n/g,'\r\n')+'\r\n'+close;
            const pos=html.indexOf(open);
