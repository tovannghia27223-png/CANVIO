              if(end<0)throw new Error('P159 inline lot is not closed: '+id);
              html=html.slice(0,pos)+tag+html.slice(end+close.length);
            }else{
              if(required)throw new Error('P159 expected existing canonical lot: '+id);
              const at=html.lastIndexOf('</body>');
              if(at<0)throw new Error('P159 body close missing');
              html=html.slice(0,at)+tag+'\r\n'+html.slice(at);
