name: CANVIO 23.3.111 — hosted runtime and integration verification

on:
  push:
    branches:
      - canvio/23-3-111-github-runtime-ci
      - work/p127-7-ducking-p145-continuation
      - work/p131-export-hardening
      - work/p145-5-template-factory
      - work/p136-bezier-smoothing
      - work/p136-single-line-stroke
      - work/p125-2-scroll-storyboard
      - work/p125-4-rebased-20261121
      - work/p145-asset-library-rebased-20261121
      - work/p132-apng
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_model_acceptance:
        description: Run slow ORMBG, Depth Anything and Whisper WASM model inference checks
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: canvio-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore complete candidate index from verified chunks
        shell: bash
        run: |
          set -euo pipefail
          if test -s .canvio/candidate/index/part-001.txt; then
            cat .canvio/candidate/index/part-*.txt > /tmp/canvio-index-original.html
            test "$(wc -c < /tmp/canvio-index-original.html)" -eq 4921610
            actual="$(sha256sum /tmp/canvio-index-original.html | cut -d' ' -f1)"
            expected="1736457b13aa9db40d847ea065ea521328d247709664dde6b1d3781088869b82"
            test "$actual" = "$expected" || { echo "Candidate index checksum mismatch: $actual" >&2; exit 1; }
            node <<'NODE'
            const fs=require('node:fs');
            let html=fs.readFileSync('/tmp/canvio-index-original.html','utf8');
            if(!html.includes('23.3.108-p85-studio-r2')) throw new Error('Unexpected candidate source version marker');
            html=html.replaceAll('23.3.108-p85-studio-r2','23.3.111-github-runtime-ci');
            html=html.replaceAll('CANVIO 23.3.108 — Creative Runtime Lab · P85 Runtime Hardening r2','CANVIO 23.3.111 — GitHub Runtime Verified Candidate');
            html=html.replaceAll('<title>CANVIO 23.3.108 — Creative Runtime Lab · P85</title>','<title>CANVIO 23.3.111 — GitHub Runtime Verified Candidate</title>');
            if(html.includes('23.3.108-p85-studio-r2')) throw new Error('Legacy candidate version marker remains');
            if(!html.includes('<title>CANVIO 23.3.111 — GitHub Runtime Verified Candidate</title>')) throw new Error('Candidate document title was not updated');
            const p57Source=fs.readFileSync('tests/p57/p57-native-persistence.js','utf8').trim();
            const p57Tag=/(<script\b(?=[^>]*\bid=["']canvio-p57-native-persistence-audit["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
            if(!p57Tag.test(html)) throw new Error('P57 native persistence module is missing from candidate index');
            html=html.replace(p57Tag,(_,open,close)=>open+'\n'+p57Source+'\n'+close);
            const p60Source=fs.readFileSync('tests/p60/p60-accessibility-audit.js','utf8').trim();
            const p60Tag=/(<script\b(?=[^>]*\bid=["']canvio-p60-accessibility-screening["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
            if(!p60Tag.test(html)) throw new Error('P60 accessibility module is missing from candidate index');
            html=html.replace(p60Tag,(_,open,close)=>open+'\n'+p60Source+'\n'+close);
            const p68Source=fs.readFileSync('canvio-p68-p70.js','utf8').trim();
            const p68Tag=/(<script\b(?=[^>]*\bid=["']canvio-p68-p70-main["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
            if(!p68Tag.test(html)) throw new Error('P68-P70 module is missing from candidate index');
            html=html.replace(p68Tag,(_,open,close)=>open+'\n'+p68Source+'\n'+close);
            fs.writeFileSync('index.html',html,'utf8');
            console.log('Restored and version-pinned complete index.html');
          NODE
            rm -rf .canvio/candidate/index
          else
            test -s index.html
            grep -q '23.3.111-github-runtime-ci' index.html || { echo "No staged candidate chunks or pinned 23.3.111 index found." >&2; exit 1; }
            echo "Using committed CANVIO candidate index."
          fi

      - name: Integrate P125.2 scroll storyboard editor
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const frameSource=fs.readFileSync('canvio-p125-scrollframes.js','utf8').trim();
          const storySource=fs.readFileSync('canvio-p125-storyboard.js','utf8').trim();
          if(!frameSource.includes('window.CVScrollFramesP125'))throw new Error('P125 frame source missing');
          if(!storySource.includes('window.CVScrollStoryboardP1252'))throw new Error('P125.2 storyboard source missing');
          const re=/(<script\b(?=[^>]*\bid=["']canvio-lot125f["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
          if(!re.test(html))throw new Error('P125.1 embedded lot missing');
          html=html.replace(re,'<script id="canvio-lot125f">\n'+frameSource+'\n</script>');
          const tag='<script id="canvio-lot1252">\n'+storySource+'\n</script>';
          if(html.includes('id="canvio-lot1252"'))html=html.replace(/<script\b(?=[^>]*\bid=["']canvio-lot1252["'])[^>]*>[\s\S]*?<\/script\s*>/i,tag);
          else{const at=html.lastIndexOf('</body>');if(at<0)throw new Error('index.html has no closing body tag');html=html.slice(0,at)+tag+'\n'+html.slice(at);}
          if((html.match(/id="canvio-lot1252"/g)||[]).length!==1)throw new Error('P125.2 duplicate/missing lot');
          fs.writeFileSync(file,html,'utf8');
          console.log('P125.1/P125.2 storyboard modules integrated');
          NODE

      - name: Integrate P136 optional Bezier contour smoothing
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p136-trace.js','utf8').trim();
          if(!source.includes('window.CVTraceP136'))throw new Error('P136 source contract missing');
          const re=/(<script\b(?=[^>]*\bid=["']canvio-lot136t["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
          if(!re.test(html))throw new Error('P136 embedded lot missing');
          html=html.replace(re,'<script id="canvio-lot136t">\n'+source+'\n</script>');
          if((html.match(/id="canvio-lot136t"/g)||[]).length!==1)throw new Error('P136 embedded lot duplicate/missing');
          fs.writeFileSync(file,html,'utf8');
          console.log('P136 updated to optional Bezier mode');
          NODE

      - name: Integrate P145.5 local Template Factory
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p145-templates.js','utf8').trim();
          if(!source.includes('window.CVTemplateFactoryP1455'))throw new Error('P145.5 source contract missing');
          const tag='<script id="canvio-lot1455">\n'+source+'\n</script>';
          const re=/(<script\b(?=[^>]*\bid=["']canvio-lot1455["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
          if(re.test(html))html=html.replace(re,tag);
          else{const at=html.lastIndexOf('</body>');if(at<0)throw new Error('index.html has no closing body tag');html=html.slice(0,at)+tag+'\n'+html.slice(at);}
          if((html.match(/id="canvio-lot1455"/g)||[]).length!==1)throw new Error('P145.5 embedded lot duplicate/missing');
          fs.writeFileSync(file,html,'utf8');
          console.log('P145.5 local template factory integrated');
          NODE

      - name: Integrate P145.6–P145.10 Asset Library modules
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const specs=[
            {name:'P145.6 original SVG icon pack',file:'canvio-p145-icons.js',id:'canvio-lot1456',contract:'window.CVOriginalIconPackP1456'},
            {name:'P145.7 system typography presets',file:'canvio-p145-typography.js',id:'canvio-lot1457',contract:'window.CVTypographyPresetsP1457'},
            {name:'P145.8 original SVG illustrations',file:'canvio-p145-visual-assets.js',id:'canvio-lot1458',contract:'window.CVOriginalVectorAssetsP1458'},
            {name:'P145.9/10 Asset Search and Quality Gate',file:'canvio-p145-search-gate.js',id:'canvio-lot145910',contract:'window.CVAssetSearchGateP145910'}
          ];
          const file='index.html';let html=fs.readFileSync(file,'utf8');
          for(const spec of specs){
            const source=fs.readFileSync(spec.file,'utf8').trim();
            if(!source.includes(spec.contract))throw new Error(spec.name+' source contract missing');
            const openTag='<script id="'+spec.id+'">';
            const re=new RegExp('(<script\\b(?=[^>]*\\bid=["\\\']'+spec.id+'["\\\'])[^>]*>)[\\s\\S]*?(<\\/script\\s*>)','i');
            const tag=openTag+'\\n'+source+'\\n</script>';
            if(re.test(html))html=html.replace(re,tag);
            else{
              const at=html.lastIndexOf('</body>');
              if(at<0)throw new Error('index.html has no closing body tag for '+spec.id);
              html=html.slice(0,at)+tag+'\\n'+html.slice(at);
            }
            if((html.match(new RegExp('id="'+spec.id+'"','g'))||[]).length!==1)throw new Error(spec.id+': duplicate/missing embedded lot');
          }
          fs.writeFileSync(file,html,'utf8');
          console.log('P145.6–P145.10 Asset Library modules integrated into canonical index.html');
          NODE

      - name: Integrate P127.7 subtitle-led music ducking
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p127-duck.js','utf8').trim();
          if(!source.includes('window.CVDuckSubP127'))throw new Error('P127.7 source contract missing');
          if(!html.includes('id="canvio-lot127k"')){
            const at=html.lastIndexOf('</body>');
            if(at<0)throw new Error('index.html has no closing body tag');
            html=html.slice(0,at)+'<script id="canvio-lot127k">\n'+source+'\n</script>\n'+html.slice(at);
          }
          if((html.match(/id="canvio-lot127k"/g)||[]).length!==1)throw new Error('P127.7 duplicate or missing script tag');
          fs.writeFileSync(file,html,'utf8');
          console.log('P127.7 integrated into canonical index.html');
          NODE

      - name: Integrate P131 shared sanitizer and export redaction boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const specs=[
            {name:'P67 Print Production',file:'canvio-p63-p67.js',id:'canvio-p63-p67-main'},
            {name:'P73 Offline Website',file:'canvio-p73-offline-site.js',id:'canvio-p73-offline-site'},
            {name:'P145 Content Factory',file:'canvio-p145-core.js',id:'canvio-lot145c'}
          ];
          for(const spec of specs){
            const source=fs.readFileSync(spec.file,'utf8').trim();
            const openTag='<script id="'+spec.id+'">';
            const open=html.indexOf(openTag);
            if(open<0||html.indexOf(openTag,open+1)>=0)throw new Error(spec.name+' expected one canonical '+openTag);
            const bodyStart=open+openTag.length,close=html.indexOf('</script>',bodyStart);
            if(close<0)throw new Error(spec.name+' closing script tag missing');
            const end=close+'</script>'.length;
            html=html.slice(0,open)+openTag+'\n'+source+'\n</script>'+html.slice(end);
            const verifyStart=html.indexOf(openTag)+openTag.length,verifyEnd=html.indexOf('</script>',verifyStart);
            if(html.slice(verifyStart,verifyEnd).trim()!==source)throw new Error(spec.name+' embedded source sync verification failed');
          }
          fs.writeFileSync(file,html,'utf8');
          console.log('P131 P67/P73/P145 owners synced by verified canonical script IDs');
          NODE

      - name: Integrate P145.2 shader transitions and effects
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p145-shader.js','utf8').trim();
          if(!source.includes('window.CVShaderP145'))throw new Error('P145.2 source contract missing');
          const re=/(<script\b(?=[^>]*\bid=["']canvio-lot1452["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
          const tag='<script id="canvio-lot1452">\n'+source+'\n</script>';
          const found=html.match(re);
          if(found)html=html.replace(re,tag);
          else{
            const at=html.lastIndexOf('</body>');
            if(at<0)throw new Error('index.html has no closing body tag');
            html=html.slice(0,at)+tag+'\n'+html.slice(at);
          }
          if((html.match(/id="canvio-lot1452"/g)||[]).length!==1)throw new Error('P145.2 embedded lot duplicate/missing');
          fs.writeFileSync(file,html,'utf8');
          console.log('P145.2 shader module integrated into canonical index.html');
          NODE

      - name: Integrate P145.4b official embedded music preview
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p145-music-preview.js','utf8').trim();
          if(!source.includes('window.CVMusicPreviewP1454B'))throw new Error('P145.4b source contract missing');
          const re=/(<script\b(?=[^>]*\bid=["']canvio-lot1454b["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
          const tag='<script id="canvio-lot1454b">\n'+source+'\n</script>';
          const found=html.match(re);
          if(found)html=html.replace(re,tag);
          else{const at=html.lastIndexOf('</body>');if(at<0)throw new Error('index.html has no closing body tag');html=html.slice(0,at)+tag+'\n'+html.slice(at);}
          if((html.match(/id="canvio-lot1454b"/g)||[]).length!==1)throw new Error('P145.4b embedded lot duplicate/missing');
          fs.writeFileSync(file,html,'utf8');
          console.log('P145.4b official music preview integrated');
          NODE

      - name: Integrate P145.4 local background music composer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p145-music.js','utf8').trim();
          if(!source.includes('window.CVMusicComposerP1454'))throw new Error('P145.4 music source contract missing');
          const re=/(<script\b(?=[^>]*\bid=["']canvio-lot1454["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
          const tag='<script id="canvio-lot1454">\n'+source+'\n</script>';
          const found=html.match(re);
          if(found)html=html.replace(re,tag);
          else{const at=html.lastIndexOf('</body>');if(at<0)throw new Error('index.html has no closing body tag');html=html.slice(0,at)+tag+'\n'+html.slice(at);}
          if((html.match(/id="canvio-lot1454"/g)||[]).length!==1)throw new Error('P145.4 embedded lot duplicate/missing');
          fs.writeFileSync(file,html,'utf8');
          console.log('P145.4 local background music composer integrated');
          NODE

      - name: Integrate P132 animated PNG export
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p132-gif.js','utf8').trim();
          if(!source.includes('window.CVGifP132')||!source.includes('encodeApng: encodeApng'))throw new Error('P132 APNG source contract missing');
          const id='canvio-lot132g',tag='<script id="'+id+'">\n'+source+'\n</script>';
          const re=/(<script\b(?=[^>]*\bid=["']canvio-lot132g["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
          if(re.test(html))html=html.replace(re,tag);
          else{const at=html.lastIndexOf('</body>');if(at<0)throw new Error('index.html has no closing body tag');html=html.slice(0,at)+tag+'\n'+html.slice(at);}
          if((html.match(/id="canvio-lot132g"/g)||[]).length!==1)throw new Error('P132 embedded lot duplicate/missing');
          fs.writeFileSync(file,html,'utf8');
          console.log('P132 GIF + APNG encoder integrated');
          NODE

      - name: Integrate P127.2 caption-guided talking-head director
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p127-director.js','utf8').trim();
          if(!source.includes('window.CVCaptionDirectorP1272'))throw new Error('P127.2 module contract missing');
          const id='canvio-lot1272';
          const tag='<script id="'+id+'">\n'+source+'\n</script>';
          const start=html.indexOf('<script id="'+id+'"');
          if(start>=0){const close=html.indexOf('</script>',start);if(close<0)throw new Error('P127.2 embedded lot is unterminated');html=html.slice(0,start)+tag+html.slice(close+9);}
          else{const at=html.lastIndexOf('</body>');if(at<0)throw new Error('index.html has no closing body tag');html=html.slice(0,at)+tag+'\n'+html.slice(at);}
          if((html.match(/id="canvio-lot1272"/g)||[]).length!==1)throw new Error('P127.2 duplicate/missing lot');
          fs.writeFileSync(file,html,'utf8');
          console.log('P127.2 caption-guided talking-head director integrated');
          NODE

      - name: Verify native test utilities
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tool in zip ffmpeg; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if (("${#missing[@]}" > 0)); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          zip -v | sed -n '1p'

      - name: Validate vendor provisioning scripts
        run: |
          set -euo pipefail
          bash -n scripts/activate-vendor-tree.sh scripts/vendor-three-r187.sh scripts/vendor-p85-runtimes.sh
          test -s scripts/p85-renderers.entry.mjs
          test -s scripts/p85-opencv.entry.mjs

      - name: Provision pinned Three.js r187, Draco, Meshopt and KTX2 runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! test -s assets/three/THREE-VENDOR-MANIFEST.json; then bash scripts/vendor-three-r187.sh; fi
          test -s assets/three/THREE-VENDOR-MANIFEST.json
          test -s assets/three/build/three.module.js
          test -s assets/three/examples/jsm/loaders/DRACOLoader.js
          test -s assets/three/examples/jsm/loaders/KTX2Loader.js
          test -s assets/three/examples/jsm/libs/meshopt_decoder.module.js
          test -s assets/three/examples/jsm/libs/draco/gltf/draco_decoder.wasm
          test -s assets/three/examples/jsm/libs/basis/basis_transcoder.wasm
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path');
          const root='assets/three',m=JSON.parse(fs.readFileSync(root+'/THREE-VENDOR-MANIFEST.json','utf8'));
          if(m.format!=='CANVIO_THREE_VENDOR_MANIFEST'||m.revision!=='r187'||!Array.isArray(m.files)||!m.files.length)throw new Error('Three vendor manifest invalid');
          for(const e of m.files){const b=fs.readFileSync(path.join(root,e.path));if(b.length!==e.bytes||crypto.createHash('sha256').update(b).digest('hex')!==e.sha256)throw new Error('Three SHA mismatch: '+e.path);}
          console.log('Three.js r187 manifest SHA verified:',m.files.length,'files');
          NODE

      - name: Provision pinned P85 PostFX, OpenCV, dotLottie, Rive, Transformers and ONNX WASM runtimes
        shell: bash
        run: |
          set -euo pipefail
          if ! test -s assets/p85/P85-VENDOR-MANIFEST.json; then bash scripts/vendor-p85-runtimes.sh; fi
          test -s assets/p85/P85-VENDOR-MANIFEST.json
          test -s assets/p85/p85-renderers.js
          test -s assets/p85/opencv/opencv.js
          test -s assets/p85/dotlottie/index.js
          test -s assets/p85/dotlottie/dotlottie-player.wasm
          test -s assets/p85/rive/rive.js
          test -s assets/p85/rive/rive.wasm
          test -s assets/p85/transformers/transformers.min.js
          test -n "$(find assets/p85/transformers -maxdepth 1 -name 'ort-wasm*.wasm' -print -quit)"
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path');
          const root='assets/p85',m=JSON.parse(fs.readFileSync(root+'/P85-VENDOR-MANIFEST.json','utf8'));
          if(m.format!=='CANVIO_P85_VENDOR_MANIFEST'||!Array.isArray(m.files)||!m.files.length)throw new Error('P85 vendor manifest invalid');
          for(const e of m.files){const b=fs.readFileSync(path.join(root,e.path));if(b.length!==e.bytes||crypto.createHash('sha256').update(b).digest('hex')!==e.sha256)throw new Error('P85 SHA mismatch: '+e.path);}
          console.log('P85 vendor manifest SHA verified:',m.files.length,'files');
          NODE

      - name: Extract and syntax-check integrated modules and workers
        run: |
          set -euo pipefail
          node scripts/extract-integrated-modules.mjs
          for file in canvio-p74-p81-three-viewer.js canvio-p85-studio.js canvio-p102-background-removal.js canvio-p105-p107-depth-parallax.js canvio-p68-p70.js canvio-p72-glb-viewer.js canvio-p73-offline-site.js canvio-p82-p84-vector-pdf.js canvio-p87-cv-docx.js canvio-p90-p96.js canvio-p97-p101.js canvio-p104.js canvio-p127-duck.js canvio-p145-shader.js assets/canvio-rmbg-worker.js assets/canvio-depth-worker.js assets/canvio-whisper-worker.js; do node --check "$file"; done

      - name: Audit complete HTML and all inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          from pathlib import Path
          import re, subprocess, tempfile, sys
          source=Path('index.html').read_text(encoding='utf-8')
          class Audit(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.scripts=0; self.external=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if attrs.get('id'): self.ids.append(attrs['id'])
                  if tag.lower()=='script':
                      self.scripts+=1
                      if attrs.get('src'): self.external.append(attrs['src'])
          audit=Audit(); audit.feed(source)
          counts=Counter(audit.ids); duplicate=[k for k,v in counts.items() if v>1]
          blocks=re.findall(r'<script\b[^>]*>([\s\S]*?)</script\s*>',source,re.I)
          if duplicate: raise SystemExit('Duplicate HTML IDs: '+repr(duplicate[:20]))
          if audit.external: raise SystemExit('Unexpected external script src: '+repr(audit.external))
          if audit.scripts!=len(blocks): raise SystemExit('HTML parser/script extractor count mismatch')
          failures=[]
          with tempfile.TemporaryDirectory() as tmp:
              for i,script in enumerate(blocks):
                  p=Path(tmp)/f'inline-{i}.js'; p.write_text(script,encoding='utf-8')
                  x=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if x.returncode: failures.append((i,x.stderr))
          if failures:
              for i,e in failures: print('inline script',i,e,file=sys.stderr)
              raise SystemExit(f'{len(failures)} inline script syntax errors')
          print(f'PASS: {audit.scripts} inline scripts; {len(counts)} unique IDs; zero duplicates; no external script tags.')
          PY

