          if ! grep -q 'P145.2 shader verification' CANVIO_QA_REPORT.md; then
            cat >> CANVIO_QA_REPORT.md <<'QA'

          ## P145.2 shader verification

          The candidate workflow runs standalone/embedded source parity and API tests for the nine transitions, nine effects, bounded resolution and P79 muxer handoff. Hosted Chromium smoke verifies the Video Engine panel, all transition start/end frames, crossfade midpoint, module checks and PNG download. This exercises WebGL through CI SwiftShader or the documented Canvas2D fallback; it does not certify physical GPU performance, a 60 fps target on mid-range hardware, user-footage visual quality or MP4 H.264 availability on every browser. MP4 output is a short video-only transition segment with no audio.
          QA
          fi
          if ! grep -q '23.3.111 continuation — P145.2 shader transitions' CANVIO_ROADMAP.md; then
            cat >> CANVIO_ROADMAP.md <<'ROADMAP'

          ## 23.3.111 continuation — P145.2 shader transitions

          - Integrated first P145.2 increment: nine shader transitions, nine effect options, quality caps, local image input, PNG frame export and optional P79 WebCodecs video-only MP4 transition segment.
          - Uses the existing Video Engine page as the UI host and existing P79 muxer as the export owner; no third-party dependency, external fetch, new timeline, store or media database.
          - Canvas2D fallback preserves crossfade/wipe only and clearly disables shader-specific FX. Hosted browser coverage is SwiftShader/software rendering.
          - Still open: 60 fps/performance acceptance on representative physical devices, WebCodecs H.264 support matrix, professional review on real project footage, full multi-track/timeline transition editing and audio-inclusive export through the existing canonical exporter.
          ROADMAP
          fi
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const files=[];
          function walk(dir){
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              if(['.git','node_modules','.canvio','dist'].includes(e.name))continue;
              const p=path.join(dir,e.name);
              if(e.isDirectory())walk(p);
              else if(p!=='CANVIO_MANIFEST.json'){
                const b=fs.readFileSync(p);files.push({path:p.split(path.sep).join('/'),bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')});
              }
            }
          }
          walk('.');files.sort((a,b)=>a.path.localeCompare(b.path));
          const index=files.find(x=>x.path==='index.html');
          const manifest={format:'CANVIO_DELIVERY_MANIFEST',schemaVersion:2,candidate:'23.3.111-github-runtime-ci',generatedAt:new Date().toISOString(),hashAlgorithm:'SHA-256',indexSha256:index.sha256,indexBytes:index.bytes,fileCount:files.length,releaseCertified:false,releaseStatus:'BLOCKED_PENDING_REAL_WORLD_ACCEPTANCE',p70ManualGates:{total:14,pending:14,passed:0},files};
          fs.writeFileSync('CANVIO_MANIFEST.json',JSON.stringify(manifest,null,2)+'\n');
          console.log('Manifest refreshed:',files.length,'files; index SHA-256:',index.sha256);
          NODE

