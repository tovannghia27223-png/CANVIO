      - name: Audit complete HTML and all inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          from pathlib import Path
          import re, subprocess, tempfile, sys
          source=Path('index.html').read_text(encoding='utf-8')
          class Audit(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.scripts=0; self.external=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if attrs.get('id'): self.ids.append(attrs['id'])
                  if tag.lower()=='script':
                      self.scripts+=1
                      if attrs.get('src'): self.external.append(attrs['src'])
          audit=Audit(); audit.feed(source)
          counts=Counter(audit.ids); duplicate=[k for k,v in counts.items() if v>1]
          blocks=re.findall(r'<script\b[^>]*>([\s\S]*?)</script\s*>',source,re.I)
          if duplicate: raise SystemExit('Duplicate HTML IDs: '+repr(duplicate[:20]))
          if audit.external: raise SystemExit('Unexpected external script src: '+repr(audit.external))
          if audit.scripts!=len(blocks): raise SystemExit('HTML parser/script extractor count mismatch')
          failures=[]
          with tempfile.TemporaryDirectory() as tmp:
              for i,script in enumerate(blocks):
                  p=Path(tmp)/f'inline-{i}.js'; p.write_text(script,encoding='utf-8')
                  x=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if x.returncode: failures.append((i,x.stderr))
          if failures:
              for i,e in failures: print('inline script',i,e,file=sys.stderr)
              raise SystemExit(f'{len(failures)} inline script syntax errors')
          print(f'PASS: {audit.scripts} inline scripts; {len(counts)} unique IDs; zero duplicates; no external script tags.')
          PY

