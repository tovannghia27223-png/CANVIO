name: CANVIO 23.3.111 — hosted runtime and integration verification

on:
  push:
    branches:
      - canvio/23-3-111-github-runtime-ci
      - work/p127-7-ducking-p145-continuation
      - work/p131-export-hardening
      - work/p145-5-template-factory
      - work/p136-bezier-smoothing
      - work/p136-single-line-stroke
      - work/p125-2-scroll-storyboard
      - work/p125-4-rebased-20261121
      - work/p145-asset-library-rebased-20261121
      - work/p132-apng
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_model_acceptance:
        description: Run slow ORMBG, Depth Anything and Whisper WASM model inference checks
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: canvio-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install deterministic font fixtures for P118/P141
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-crosextra-caladea fontconfig
          fc-cache -f
          FULL_FONT="$(fc-match -f '%{file}' 'Liberation Sans:style=Regular')"
          PARTIAL_FONT="$(fc-match -f '%{file}' 'Caladea:style=Bold')"
          test -s "$FULL_FONT" || { echo "Liberation Sans fixture font not found" >&2; exit 1; }
          test -s "$PARTIAL_FONT" || { echo "Caladea fixture font not found" >&2; exit 1; }
          case "$FULL_FONT" in *Liberation*) ;; *) echo "Unexpected full-coverage fixture: $FULL_FONT" >&2; exit 1 ;; esac
          case "$PARTIAL_FONT" in *Caladea*) ;; *) echo "Unexpected partial-coverage fixture: $PARTIAL_FONT" >&2; exit 1 ;; esac
          echo "CANVIO_TEST_TTF=$FULL_FONT" >> "$GITHUB_ENV"
          echo "CANVIO_TEST_TTF_PARTIAL=$PARTIAL_FONT" >> "$GITHUB_ENV"
          echo "P118/P141 fixture fonts ready: $FULL_FONT; $PARTIAL_FONT"

      - name: Restore complete candidate index from verified chunks
        shell: bash
        run: |
          set -euo pipefail
          if test -s .canvio/candidate/index/part-001.txt; then
            cat .canvio/candidate/index/part-*.txt > /tmp/canvio-index-original.html
            test "$(wc -c < /tmp/canvio-index-original.html)" -eq 4921610
            actual="$(sha256sum /tmp/canvio-index-original.html | cut -d' ' -f1)"
            expected="1736457b13aa9db40d847ea065ea521328d247709664dde6b1d3781088869b82"
            test "$actual" = "$expected" || { echo "Candidate index checksum mismatch: $actual" >&2; exit 1; }
            node <<'NODE'
            const fs=require('node:fs');
            let html=fs.readFileSync('/tmp/canvio-index-original.html','utf8');
            if(!html.includes('23.3.108-p85-studio-r2')) throw new Error('Unexpected candidate source version marker');
            html=html.replaceAll('23.3.108-p85-studio-r2','23.3.111-github-runtime-ci');
            html=html.replaceAll('CANVIO 23.3.108 — Creative Runtime Lab · P85 Runtime Hardening r2','CANVIO 23.3.111 — GitHub Runtime Verified Candidate');
            html=html.replaceAll('<title>CANVIO 23.3.108 — Creative Runtime Lab · P85</title>','<title>CANVIO 23.3.111 — GitHub Runtime Verified Candidate</title>');
            if(html.includes('23.3.108-p85-studio-r2')) throw new Error('Legacy candidate version marker remains');
            if(!html.includes('<title>CANVIO 23.3.111 — GitHub Runtime Verified Candidate</title>')) throw new Error('Candidate document title was not updated');
            const p57Source=fs.readFileSync('tests/p57/p57-native-persistence.js','utf8').trim();
            const p57Tag=/(<script\b(?=[^>]*\bid=["']canvio-p57-native-persistence-audit["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
            if(!p57Tag.test(html)) throw new Error('P57 native persistence module is missing from candidate index');
            html=html.replace(p57Tag,(_,open,close)=>open+'\n'+p57Source+'\n'+close);
            const p60Source=fs.readFileSync('tests/p60/p60-accessibility-audit.js','utf8').trim();
            const p60Tag=/(<script\b(?=[^>]*\bid=["']canvio-p60-accessibility-screening["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
            if(!p60Tag.test(html)) throw new Error('P60 accessibility module is missing from candidate index');
            html=html.replace(p60Tag,(_,open,close)=>open+'\n'+p60Source+'\n'+close);
            const p68Source=fs.readFileSync('canvio-p68-p70.js','utf8').trim();
            const p68Tag=/(<script\b(?=[^>]*\bid=["']canvio-p68-p70-main["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
            if(!p68Tag.test(html)) throw new Error('P68-P70 module is missing from candidate index');
            html=html.replace(p68Tag,(_,open,close)=>open+'\n'+p68Source+'\n'+close);
            fs.writeFileSync('index.html',html,'utf8');
            console.log('Restored and version-pinned complete index.html');
          NODE
            rm -rf .canvio/candidate/index
          else
            test -s index.html
            grep -q '23.3.111-github-runtime-ci' index.html || { echo "No staged candidate chunks or pinned 23.3.111 index found." >&2; exit 1; }
            echo "Using committed CANVIO candidate index."
          fi

      - name: Integrate P150.13 Home skin root isolation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html', source=fs.readFileSync('canvio-p150-home-sky.js','utf8').trim();
          if(!source.includes("version: '150.13.0'"))throw new Error('P150.13 source version missing');
          const id='canvio-lot150h', open='<script id="'+id+'">';
          let html=fs.readFileSync(file,'utf8');
          const at=html.indexOf(open);
          if(at<0||html.indexOf(open,at+open.length)>=0)throw new Error('P150 expected exactly one embedded lot');
          const start=at+open.length, end=html.indexOf('</script>',start);
          if(end<0)throw new Error('P150 embedded lot close missing');
          const nl=String.fromCharCode(10);
          html=html.slice(0,at)+open+nl+source+nl+'</script>'+html.slice(end+'</script>'.length);
          if((html.match(/id="canvio-lot150h"/g)||[]).length!==1)throw new Error('P150 duplicate/missing lot');
          fs.writeFileSync(file,html,'utf8');
          console.log('P150.13 Home skin root isolation synced into canonical index.html');
          NODE

      - name: Integrate P125.2 scroll storyboard editor
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const frameSource=fs.readFileSync('canvio-p125-scrollframes.js','utf8').trim();
          const storySource=fs.readFileSync('canvio-p125-storyboard.js','utf8').trim();
          if(!frameSource.includes('window.CVScrollFramesP125'))throw new Error('P125 frame source missing');
          if(!storySource.includes('window.CVScrollStoryboardP1252'))throw new Error('P125.2 storyboard source missing');
          const re=/(<script\b(?=[^>]*\bid=["']canvio-lot125f["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
          if(!re.test(html))throw new Error('P125.1 embedded lot missing');
          html=html.replace(re,'<script id="canvio-lot125f">\n'+frameSource+'\n</script>');
          const tag='<script id="canvio-lot1252">\n'+storySource+'\n</script>';
          if(html.includes('id="canvio-lot1252"'))html=html.replace(/<script\b(?=[^>]*\bid=["']canvio-lot1252["'])[^>]*>[\s\S]*?<\/script\s*>/i,tag);
          else{const at=html.lastIndexOf('</body>');if(at<0)throw new Error('index.html has no closing body tag');html=html.slice(0,at)+tag+'\n'+html.slice(at);}
          if((html.match(/id="canvio-lot1252"/g)||[]).length!==1)throw new Error('P125.2 duplicate/missing lot');
          fs.writeFileSync(file,html,'utf8');
          console.log('P125.1/P125.2 storyboard modules integrated');
          NODE

      - name: Integrate P136 optional Bezier contour smoothing
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p136-trace.js','utf8').trim();
          if(!source.includes('window.CVTraceP136'))throw new Error('P136 source contract missing');
          const re=/(<script\b(?=[^>]*\bid=["']canvio-lot136t["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
          if(!re.test(html))throw new Error('P136 embedded lot missing');
          html=html.replace(re,'<script id="canvio-lot136t">\n'+source+'\n</script>');
          if((html.match(/id="canvio-lot136t"/g)||[]).length!==1)throw new Error('P136 embedded lot duplicate/missing');
          fs.writeFileSync(file,html,'utf8');
          console.log('P136 updated to optional Bezier mode');
          NODE

      - name: Integrate P145.5 local Template Factory
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p145-templates.js','utf8').trim();
          if(!source.includes('window.CVTemplateFactoryP1455'))throw new Error('P145.5 source contract missing');
          const tag='<script id="canvio-lot1455">\n'+source+'\n</script>';
          const re=/(<script\b(?=[^>]*\bid=["']canvio-lot1455["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
          if(re.test(html))html=html.replace(re,tag);
          else{const at=html.lastIndexOf('</body>');if(at<0)throw new Error('index.html has no closing body tag');html=html.slice(0,at)+tag+'\n'+html.slice(at);}
          if((html.match(/id="canvio-lot1455"/g)||[]).length!==1)throw new Error('P145.5 embedded lot duplicate/missing');
          fs.writeFileSync(file,html,'utf8');
          console.log('P145.5 local template factory integrated');
          NODE

      - name: Integrate P145.6–P145.10 Asset Library modules
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const specs=[
            {name:'P145.6 original SVG icon pack',file:'canvio-p145-icons.js',id:'canvio-lot1456',contract:'window.CVOriginalIconPackP1456'},
            {name:'P145.7 system typography presets',file:'canvio-p145-typography.js',id:'canvio-lot1457',contract:'window.CVTypographyPresetsP1457'},
            {name:'P145.8 original SVG illustrations',file:'canvio-p145-visual-assets.js',id:'canvio-lot1458',contract:'window.CVOriginalVectorAssetsP1458'},
            {name:'P145.9/10 Asset Search and Quality Gate',file:'canvio-p145-search-gate.js',id:'canvio-lot145910',contract:'window.CVAssetSearchGateP145910'}
          ];
          const file='index.html';let html=fs.readFileSync(file,'utf8');
          for(const spec of specs){
            const source=fs.readFileSync(spec.file,'utf8').trim();
            if(!source.includes(spec.contract))throw new Error(spec.name+' source contract missing');
            const openTag='<script id="'+spec.id+'">';
            const re=new RegExp('(<script\\b(?=[^>]*\\bid=["\\\']'+spec.id+'["\\\'])[^>]*>)[\\s\\S]*?(<\\/script\\s*>)','i');
            const tag=openTag+'\n'+source+'\n</script>';
            if(re.test(html))html=html.replace(re,tag);
            else{
              const at=html.lastIndexOf('</body>');
              if(at<0)throw new Error('index.html has no closing body tag for '+spec.id);
              html=html.slice(0,at)+tag+'\n'+html.slice(at);
            }
            if((html.match(new RegExp('id="'+spec.id+'"','g'))||[]).length!==1)throw new Error(spec.id+': duplicate/missing embedded lot');
          }
          fs.writeFileSync(file,html,'utf8');
          console.log('P145.6–P145.10 Asset Library modules integrated into canonical index.html');
          NODE

      - name: Integrate P127.7 subtitle-led music ducking
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';
          let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p127-duck.js','utf8').trim();
          if(!source.includes('window.CVDuckSubP127'))throw new Error('P127.7 source contract missing');
          if(!html.includes('id="canvio-lot127k"')){
            const at=html.lastIndexOf('</body>');
            if(at<0)throw new Error('index.html has no closing body tag');
            html=html.slice(0,at)+'<script id="canvio-lot127k">\n'+source+'\n</script>\n'+html.slice(at);
          }
          if((html.match(/id="canvio-lot127k"/g)||[]).length!==1)throw new Error('P127.7 duplicate or missing script tag');
          fs.writeFileSync(file,html,'utf8');
          console.log('P127.7 integrated into canonical index.html');
          NODE

      - name: Integrate P134.2 local Auto Reframe
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html', source=fs.readFileSync('canvio-p134-reframe.js','utf8').trim();
          const id='canvio-lot134r', open='<script id="'+id+'">';
          if(!source.includes('window.CVAutoReframeP134'))throw new Error('P134.2 source contract missing');
          let html=fs.readFileSync(file,'utf8');
          const first=html.indexOf(open);
          if(first>=0){
            if(html.indexOf(open,first+1)>=0)throw new Error('P134.2 duplicate embedded lot');
            const start=first+open.length, end=html.indexOf('</script>',start);
            if(end<0)throw new Error('P134.2 embedded script closing tag missing');
            html=html.slice(0,start)+'\n'+source+'\n'+html.slice(end);
          }else{
            const at=html.lastIndexOf('</body>');
            if(at<0)throw new Error('P134.2 index.html has no closing body tag');
            html=html.slice(0,at)+open+'\n'+source+'\n</script>\n'+html.slice(at);
          }
          if((html.match(/id="canvio-lot134r"/g)||[]).length!==1)throw new Error('P134.2 embedded lot duplicate/missing');
          fs.writeFileSync(file,html,'utf8');
          console.log('P134.2 local Auto Reframe integrated into canonical index.html');
          NODE

      - name: Integrate P124 responsive Auto Layout
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html',source=fs.readFileSync('canvio-p124-autolayout.js','utf8').trim(),id='canvio-lot124',open='<script id="'+id+'">';
          if(!source.includes('window.CVAutoLayoutP124'))throw new Error('P124 source contract missing');
          let html=fs.readFileSync(file,'utf8'),at=html.indexOf(open);
          if(at>=0){if(html.indexOf(open,at+1)>=0)throw new Error('P124 duplicate lot');const start=at+open.length,end=html.indexOf('</script>',start);if(end<0)throw new Error('P124 close missing');html=html.slice(0,start)+'\n'+source+'\n'+html.slice(end);}
          else{at=html.lastIndexOf('</body>');if(at<0)throw new Error('No body close');html=html.slice(0,at)+open+'\n'+source+'\n</script>\n'+html.slice(at);}
          if((html.match(/id="canvio-lot124"/g)||[]).length!==1)throw new Error('P124 duplicate/missing lot');fs.writeFileSync(file,html,'utf8');
          NODE

      - name: Integrate P133.2 local 4K to 720p proxy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html',source=fs.readFileSync('canvio-p133-proxy.js','utf8').trim(),id='canvio-lot133p',open='<script id="'+id+'">';
          if(!source.includes('window.CVProxyP133'))throw new Error('P133.2 source contract missing');
          let html=fs.readFileSync(file,'utf8'),at=html.indexOf(open);
          if(at>=0){if(html.indexOf(open,at+1)>=0)throw new Error('P133.2 duplicate lot');const start=at+open.length,end=html.indexOf('</script>',start);if(end<0)throw new Error('P133.2 close missing');html=html.slice(0,start)+'\n'+source+'\n'+html.slice(end);}
          else{at=html.lastIndexOf('</body>');if(at<0)throw new Error('No body close');html=html.slice(0,at)+open+'\n'+source+'\n</script>\n'+html.slice(at);}
          if((html.match(/id="canvio-lot133p"/g)||[]).length!==1)throw new Error('P133.2 duplicate/missing lot');fs.writeFileSync(file,html,'utf8');
          NODE

      - name: Integrate P135.2 project snapshot persistence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html',source=fs.readFileSync('canvio-p135-adjustments.js','utf8').trim(),open='<script id="canvio-lot135a">',close='</script>';
          if(!source.includes('window.CVPixelAdjustmentsP135')||!source.includes("version:'135.2.0'")||!source.includes("CANVIO.P135"))throw new Error('P135.2 project snapshot contract missing');
          let html=fs.readFileSync(file,'utf8'),tag=open+'\n'+source+'\n'+close;
          const pos=html.indexOf(open);
          if(pos>=0){const end=html.indexOf(close,pos);if(end<0)throw new Error('P135.1 embedded lot is not closed');html=html.slice(0,pos)+tag+html.slice(end+close.length);}
          else{const body=html.lastIndexOf('</body>');if(body<0)throw new Error('index.html body close missing');html=html.slice(0,body)+tag+'\n'+html.slice(body);}
          if((html.match(/id="canvio-lot135a"/g)||[]).length!==1)throw new Error('P135.2 duplicate/missing lot');
          fs.writeFileSync(file,html,'utf8');
          console.log('P135.2 Pixel adjustment snapshot module embedded in canonical index.html');
          NODE

      - name: Integrate P133.4 same-owner large-media OPFS sidecar
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html';let html=fs.readFileSync(file,'utf8');
          const source=fs.readFileSync('canvio-p133-media-opfs.js','utf8').trim();
          if(!source.includes('window.CVMediaOPFSP133'))throw new Error('P133.4 module contract missing');
          const replacements=[
            {
              old:"function vPut(id,file){return new Promise(function(resolve,reject){if(!videoState.db){resolve(false);return}var tx;try{tx=videoState.db.transaction('media','readwrite');tx.objectStore('media').put({id:id,blob:file})}catch(e){reject(e);return}tx.oncomplete=function(){resolve(true)};tx.onerror=function(){reject(tx.error||new Error('Không lưu được media vào IndexedDB'))}})}",
              next:"function vPut(id,file){var sidecar=window.CVMediaOPFSP133;if(sidecar&&typeof sidecar.put==='function')return sidecar.put(id,file,videoState).then(function(){return true});return new Promise(function(resolve,reject){if(!videoState.db){resolve(false);return}var tx;try{tx=videoState.db.transaction('media','readwrite');tx.objectStore('media').put({id:id,blob:file})}catch(e){reject(e);return}tx.oncomplete=function(){resolve(true)};tx.onerror=function(){reject(tx.error||new Error('Không lưu được media vào IndexedDB'))}})}"
            },
            {
              old:"function vGet(id){return new Promise(function(resolve){if(!videoState.db){resolve(null);return}var q;try{q=videoState.db.transaction('media').objectStore('media').get(id)}catch(e){resolve(null);return}q.onsuccess=function(){resolve(q.result&&q.result.blob)};q.onerror=function(){resolve(null)}})}",
              next:"function vGet(id){var sidecar=window.CVMediaOPFSP133;if(sidecar&&typeof sidecar.get==='function')return sidecar.get(id,videoState).then(function(blob){return blob||null});return new Promise(function(resolve){if(!videoState.db){resolve(null);return}var q;try{q=videoState.db.transaction('media').objectStore('media').get(id)}catch(e){resolve(null);return}q.onsuccess=function(){resolve(q.result&&q.result.blob)};q.onerror=function(){resolve(null)}})}"
            },
            {
              old:"function vDelete(id){return new Promise(function(resolve){if(!videoState.db||!id){resolve(false);return}try{var tx=videoState.db.transaction('media','readwrite');tx.objectStore('media').delete(id);tx.oncomplete=function(){resolve(true)};tx.onerror=tx.onabort=function(){resolve(false)}}catch(e){resolve(false)}})}",
              next:"function vDelete(id){var sidecar=window.CVMediaOPFSP133;if(sidecar&&typeof sidecar.remove==='function')return sidecar.remove(id,videoState);return new Promise(function(resolve){if(!videoState.db||!id){resolve(false);return}try{var tx=videoState.db.transaction('media','readwrite');tx.objectStore('media').delete(id);tx.oncomplete=function(){resolve(true)};tx.onerror=tx.onabort=function(){resolve(false)}}catch(e){resolve(false)}})}"
            }
          ];
          for(const item of replacements){
            if(html.includes(item.next))continue;
            if(!html.includes(item.old))throw new Error('P133.4 canonical media owner hook not found');
            html=html.replace(item.old,item.next);
          }
          const id='canvio-lot133m',tag='<script id="'+id+'">\n'+source+'\n</script>';
          const re=/(<script\b(?=[^>]*\bid=["']canvio-lot133m["'])[^>]*>)[\s\S]*?(<\/script\s*>)/i;
          if(re.test(html))html=html.replace(re,tag);
          else{const at=html.lastIndexOf('</body>');if(at<0)throw new Error('P133.4 no closing body');html=html.slice(0,at)+tag+'\n'+html.slice(at);}
          if((html.match(/id="canvio-lot133m"/g)||[]).length!==1)throw new Error('P133.4 duplicate/missing lot');
          for(const marker of ["window.CVMediaOPFSP133","sidecar.put(id,file,videoState)","sidecar.get(id,videoState)","sidecar.remove(id,videoState)"])if(!html.includes(marker))throw new Error('P133.4 integration missing '+marker);
          fs.writeFileSync(file,html,'utf8');
          console.log('P133.4 staged OPFS media bytes through existing CANVIO_81_MEDIA metadata owner');
          NODE

      - name: Integrate P144.3 contextual Studio help
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html',source=fs.readFileSync('canvio-p144-ux.js','utf8').trim(),id='canvio-lot144u',open='<script id="'+id+'">';
          if(!source.includes("version: '144.3.0'"))throw new Error('P144.3 source version missing');
          let html=fs.readFileSync(file,'utf8'),at=html.indexOf(open);
          if(at<0)throw new Error('P144 embedded lot missing');
          if(html.indexOf(open,at+1)>=0)throw new Error('P144 duplicate lot');
          const start=at+open.length,end=html.indexOf('</script>',start);
          if(end<0)throw new Error('P144 close missing');
          html=html.slice(0,start)+'\n'+source+'\n'+html.slice(end);
          if((html.match(/id="canvio-lot144u"/g)||[]).length!==1)throw new Error('P144 duplicate/missing lot');
          fs.writeFileSync(file,html,'utf8');
          NODE

      - name: Integrate P139.1 Motion Lab parent hierarchy and live text animator
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='index.html',source=fs.readFileSync('canvio-p139-motionlab.js','utf8').trim(),id='canvio-lot139',open='<script id="'+id+'">',close='</script>';
          if(!source.includes('root.CVMotionLabP139'))throw new Error('P139.1 source contract missing');
          const nl=String.fromCharCode(10);
          let html=fs.readFileSync(file,'utf8'),tag=open+nl+source+nl+close;
          const pos=html.indexOf(open);
