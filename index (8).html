:root{--bg:#f5f5f7;--bg-elev:#fff;--cd:rgba(255,255,255,.72);--cd-solid:#fff;--tx:#1d1d1f;--mu:#6e6e73;--bd:rgba(0,0,0,.07);--bd-strong:rgba(0,0,0,.12);--ac:#0071e3;--ac2:#0077ed;--ac-soft:rgba(0,113,227,.10);--ok:#30b14b;--no:#ff3b30;--wa:#ff9500;--sh-sm:0 1px 2px rgba(0,0,0,.04);--sh:0 2px 8px rgba(15,23,42,.035),0 8px 24px rgba(15,23,42,.035);--r-sm:9px;--r:12px;--r-lg:16px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Be Vietnam Pro",system-ui,sans-serif;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--bg-elev:#1c1c1e;--cd:rgba(28,28,30,.72);--cd-solid:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.08);--bd-strong:rgba(255,255,255,.16);--ac:#0a84ff;--ac2:#3395ff;--ac-soft:rgba(10,132,255,.16);--ok:#30d158;--no:#ff453a;--wa:#ff9f0a;--sh-sm:0 1px 2px rgba(0,0,0,.4);--sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
[data-theme=dark]{--bg:#000;--bg-elev:#1c1c1e;--cd:rgba(28,28,30,.72);--cd-solid:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--bd:rgba(255,255,255,.08);--bd-strong:rgba(255,255,255,.16);--ac:#0a84ff;--ac2:#3395ff;--ac-soft:rgba(10,132,255,.16);--ok:#30d158;--no:#ff453a;--wa:#ff9f0a;--sh-sm:0 1px 2px rgba(0,0,0,.4);--sh:0 2px 8px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}

.rl{margin:8px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--ac);background:var(--ac-soft);border-radius:9px;padding:7px}
.app.sbc .rail{padding:18px 10px;align-items:center}.app.sbc .brand b,.app.sbc .nv span,.app.sbc .rl{display:none}.app.sbc .nv{width:44px;justify-content:center;padding:0;min-height:40px}.app.sbc .nv .i{width:22px;height:22px}.app.sbc .brand{padding:2px 0 14px}.app.sbc .seg{flex-direction:column;width:44px;margin:8px 0}
.main{display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0}
.hd{display:flex;align-items:center;gap:12px;padding:20px 24px 6px}.hd h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}.hd p{margin:0;color:var(--mu);font-size:13px}

.body{flex:1;overflow:auto;padding:12px 24px 96px;contain:content}

.sp{flex:1}
.btn{padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;background:var(--cd-solid);border:1px solid var(--bd-strong);transition:background .18s}.btn:hover{background:var(--ac-soft)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{background:var(--ac2)}.btn.d{color:var(--no)}.btn.d:hover{background:rgba(255,59,48,.1)}
.pop{position:absolute;right:24px;top:150px;z-index:20;background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r);padding:6px;min-width:210px;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.pop button{display:flex;gap:8px;align-items:center;width:100%;padding:9px 12px;border-radius:9px;text-align:left;font-weight:500}.pop button:hover{background:var(--ac-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:var(--sh-sm);content-visibility:auto;contain-intrinsic-size:170px}
.card.sel{outline:2px solid var(--ac)}.card h3{margin:0;font-size:15px}.card p{margin:0;color:var(--mu);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;width:fit-content}
.t-todo{background:rgba(255,149,0,.16);color:var(--wa)}.t-doing{background:var(--ac-soft);color:var(--ac)}.t-done{background:rgba(48,177,75,.16);color:var(--ok)}.t-doc{background:rgba(120,120,128,.16);color:var(--mu)}
.pg{height:5px;border-radius:9px;background:rgba(120,120,128,.18);overflow:hidden}.pg i{display:block;height:100%;background:var(--ac)}
.ft{display:flex;align-items:center;gap:6px;margin-top:auto;color:var(--mu);font-size:11.5px}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;margin-right:-6px;border:2px solid var(--cd-solid)}
.ic{width:28px;height:28px;border-radius:8px;color:var(--mu)}.ic:hover{background:rgba(255,59,48,.12);color:var(--no)}.ck{position:absolute;top:10px;right:10px;width:20px;height:20px;accent-color:var(--ac)}
.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;background:var(--cd);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--bd);padding:5px;border-radius:99px;box-shadow:var(--sh)}
.dock button{padding:7px 16px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--mu)}.dock button:hover{background:var(--ac-soft)}.dock button.on{background:var(--ac-soft);color:var(--ac)}
.side{background:var(--cd-solid);border-left:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.side h2{margin:0;font-size:16px;letter-spacing:-.02em}
.tabs{display:flex;gap:2px;background:rgba(120,120,128,.15);padding:3px;border-radius:12px}.tabs button{flex:1;padding:6px;border-radius:9px;font-size:12px;font-weight:600;color:var(--mu);transition:all .25s cubic-bezier(.2,.8,.2,1)}.tabs button.on{background:var(--cd-solid);color:var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.cl{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}.cl>*{flex:none}
.it{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;font-size:12.5px}.it small{color:var(--mu);display:block}
.mem{display:flex;align-items:center;gap:10px}.mem .av{margin:0;width:30px;height:30px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:auto}
.chat{display:flex;flex-direction:column;gap:8px}.msg{max-width:82%;padding:8px 12px;border-radius:16px 16px 16px 5px;background:var(--bg);font-size:13.5px;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--ac);color:#fff;border-radius:16px 16px 5px 16px}.msg small{opacity:.65;display:block;font-size:10px}
.cin{display:flex;gap:8px}.cin input{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;outline:0}.cin input:focus{border-color:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center;padding:16px}
.ed{background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r-lg);width:min(900px,100%);height:min(640px,92%);display:flex;flex-direction:column;overflow:hidden}
.edh{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}.edh b{flex:1}
.page{flex:1;overflow:auto;padding:28px 40px;outline:0;background:#fff;color:#111;line-height:1.7}
.sh{flex:1;overflow:auto}.sh table{border-collapse:collapse;width:100%}.sh td,.sh th{border:1px solid var(--bd-strong);padding:6px 8px;min-width:90px;font-size:13px;outline:0}.sh th{background:var(--bg);color:var(--mu);font-size:11px}.sh td:focus{outline:2px solid var(--ac);background:var(--ac-soft)}
.empty{text-align:center;color:var(--mu);padding:60px 0}
#fab{display:none;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:var(--ac);color:#fff;font-size:22px;place-items:center;z-index:45;box-shadow:0 8px 24px rgba(0,113,227,.45)}
@media(max-width:1000px){.app,.app.sbc{grid-template-columns:76px minmax(0,1fr) 290px}.sr{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app,.app.sbc{grid-template-columns:76px minmax(0,1fr)}.side{position:fixed;inset:12px;z-index:40;display:none;border:1px solid var(--bd);border-radius:var(--r-lg)}.side.open{display:flex}#fab{display:grid}.dock{display:none}}
.bell{margin-left:8px}.bn{position:absolute;top:0;right:0;min-width:16px;height:16px;border-radius:9px;background:var(--no);color:#fff;font-size:10px;font-weight:700;place-items:center;padding:0 4px}
.bp{position:fixed;right:20px;top:64px;z-index:60;width:min(340px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.25);padding:8px;display:flex;flex-direction:column;gap:6px}.bp .it{cursor:pointer}.bp .it.un{border-color:var(--ac)}
.mn{color:var(--ac);font-weight:600}.msg.me .mn{color:#fff;text-decoration:underline}
.ic.cm{width:auto;display:inline-flex;align-items:center;gap:4px;padding:0 8px;font-size:12px}.ic.cm:hover{background:var(--ac-soft);color:var(--ac)}
select.sel{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;outline:0;color:var(--tx)}
.sg{position:fixed;z-index:70;background:var(--cd-solid);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.25);padding:4px;min-width:180px}.sg button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px}.sg button:hover{background:var(--ac-soft)}
.dh{font-weight:700;font-size:13px;margin:12px 0 2px;color:var(--mu)}.ed.sm{width:min(480px,100%);height:min(560px,92%)}.ed.sm .cl{padding:12px 16px}.ed.sm .cin{padding:0 16px 14px}
@media(max-width:1000px){.hd .bell{margin-left:auto}}
.lgi{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;outline:0;color:var(--tx)}.lgi:focus{border-color:var(--ac)}

/* Workspace polish: responsive layouts, safe text wrapping and bilingual controls */
.ws-back-link{white-space:nowrap;flex:none}.ws-back-link .i{width:16px;height:16px}
.hd{flex-wrap:wrap;min-width:0}.hd>div:first-child{min-width:0;max-width:100%}.hd h1{line-height:1.25;overflow-wrap:anywhere}.hd p{line-height:1.45;overflow-wrap:anywhere}
.body{min-width:0;overflow-x:hidden}.card,.it,.st,.ft,.mem,.bar,.side,.main{min-width:0}.card h3,.card p,.it,.ft,.empty{overflow-wrap:anywhere;word-break:normal}
.ft{flex-wrap:wrap;row-gap:6px}.ft .sp{min-width:8px}.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.btn,.chip,.nv{white-space:normal;line-height:1.35}.nv span{overflow-wrap:anywhere}.tabs button{min-width:0;white-space:normal}.cin{min-width:0}.cin input{min-width:0;width:100%}
@media(max-width:760px){.app,.app.sbc{grid-template-columns:58px minmax(0,1fr)}.rail{padding:12px 6px}.app.sbc .nv{width:42px}.hd{padding:14px 14px 6px}.body{padding:10px 14px 88px}.hd h1{font-size:19px}.stats{gap:8px}.st{padding:10px}.st b{font-size:21px}.dock{max-width:calc(100% - 24px);overflow-x:auto}.dock button{white-space:nowrap;padding:7px 12px}}

/* ===== Redesign v2 ===== */
:root{--ac:#1473f5;--ac2:#3d6df0;--ac-soft:rgba(20,115,245,.10);--grad:linear-gradient(135deg,#1a7cff 0%,#5b5fe6 100%);--font:"Be Vietnam Pro",-apple-system,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ac:#4d94ff;--ac2:#7a82ff;--ac-soft:rgba(77,148,255,.16)}}
[data-theme=dark]{--ac:#4d94ff;--ac-soft:rgba(77,148,255,.16)}
.btn.p,.btn.p:hover{background:var(--grad);border-color:transparent}.btn.p:hover{filter:brightness(1.07)}
.logo{background:var(--grad);border-radius:11px}.card{border-radius:20px}.st{border-radius:18px}
.app{position:relative}.rail{padding:16px 12px;gap:0}
.gl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:16px 12px 6px}
.nv{font-weight:600;font-size:14px;min-height:40px;gap:12px}.nv.on{border-radius:4px 10px 10px 4px}
.usr{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 6px 4px;border-top:1px solid var(--bd)}
.usr .ua{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.usr b{display:block;font-size:13.5px;line-height:1.25}.usr small{color:var(--mu);font-size:12px}.usr button{margin-left:auto;color:var(--mu)}
#rc{position:absolute;z-index:30;top:62px;left:218px;width:28px;height:28px;border-radius:50%;background:#1f2937;color:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:left .25s}
#rc .i{width:15px;height:15px;transition:transform .25s}.app.sbc #rc{left:62px}.app.sbc #rc .i{transform:rotate(180deg)}
.app.sbc .gl{font-size:0;padding:0;margin:10px 10px 4px;border-top:1px solid var(--bd);width:28px}.app.sbc .usr{flex-direction:column;border:0}.app.sbc .un{display:none}
@media(max-width:760px){#rc,.app.sbc #rc{left:44px}}
/* thẻ mở rộng (hình 3) */
.xc{--c:#14b8a6;padding:0;gap:0;border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 8%,var(--cd-solid)),var(--cd-solid) 75%);border-radius:22px;box-shadow:0 6px 20px color-mix(in srgb,var(--c) 10%,transparent)}
.xc.todo{--c:#ff9500}.xc.doing{--c:#14b8a6}.xc.done{--c:#30b14b}
.xh{display:flex;align-items:center;gap:12px;padding:14px 16px}
.xi{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c));color:#fff;display:grid;place-items:center;flex:none}.xi .i{width:21px;height:21px}
.xt{flex:1;min-width:0}.xt h3{font-size:15px;margin:0}.xt small{color:var(--mu);font-size:12.5px}
.xb{width:32px;height:32px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);display:grid;place-items:center;flex:none}
.xb .i{transition:transform .3s}.xc.open .xb .i{transform:rotate(180deg)}
.xx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.xc.open .xx{grid-template-rows:1fr}.xx>div{overflow:hidden;min-height:0}
.xx .in{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}.xx p{margin:0;color:var(--mu);font-size:13.5px;display:block}
.tg{display:flex;gap:8px;flex-wrap:wrap}.tg .tag{border-radius:9px;padding:4px 10px;display:inline-flex;gap:5px;align-items:center}
.xf{display:flex;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid var(--bd);color:var(--mu);font-size:12px}
/* mục tiêu (hình 5) */
.gg{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.gc{padding:0;gap:0;border-radius:24px;overflow:hidden;box-shadow:var(--sh)}
.gh{background:var(--grad);color:#fff;padding:16px 16px 30px;display:flex;gap:12px;align-items:center}.gh .xi{background:rgba(255,255,255,.22)}.gh h3{margin:0;font-size:16px}.gh small{opacity:.85;font-size:12.5px}.gh .ic{color:#fff}
.gb{margin:-16px 10px 0;background:var(--cd-solid);border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 6px 18px rgba(30,40,120,.12);position:relative}

.gi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}.gi .i{width:15px;height:15px}
.gd{margin:12px 10px 0;background:rgba(124,92,240,.10);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.gv{margin:12px 10px 14px;height:44px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
/* họp Google Meet (hình 4) */
.mt{position:relative;max-width:580px;background:#cfc2ff;color:#241a4d;border-radius:30px;padding:16px 18px;display:flex;flex-direction:column;gap:16px;border:0;box-shadow:0 10px 30px rgba(124,92,240,.22)}

 if(view==='feed')h+=a.length?`<div class="grid" style="grid-template-columns:1fr;max-width:640px">${a.map(f=>card(f,`<div class="ft">${av(f.who)}<b style="margin-left:10px;color:var(--tx)">${esc(f.who)}</b><span>· ${esc(f.time)}</span><span class="sp"></span><button class="ic cm" data-a="cm" data-v="feed" title="Bình luận"><svg class="i"><use href="#i-messages"/></svg>${cmN('feed',f.id)||''}</button>${trash(f)}</div><h3 style="font-weight:500">${fm(f.t)}</h3>`)).join('')}</div>`:'<div class="empty">Chưa có bài viết</div>';
 if(view==='events'){const now=Date.now();let rows=S.events.filter(e=>!qs||e.t.toLowerCase().includes(qs)).map(e=>({...e,ts:new Date(e.at).getTime()}));
  if(!qs)S.projects.forEach(p=>{if(/^\d{4}-\d\d-\d\d/.test(p.due))rows.push({virt:1,t:'Hạn dự án: '+p.t,k:'deadline',ts:new Date(p.due+'T23:59:00').getTime(),who:p.who||[]})});
  rows=rows.filter(r=>evf==='up'?r.ts>=now-36e5:r.ts<now-36e5).sort((x,y)=>evf==='up'?x.ts-y.ts:y.ts-x.ts);let lastD='';
  h+=rows.length?'<div style="max-width:640px;display:flex;flex-direction:column;gap:8px">'+rows.map(r=>{const d=new Date(r.ts).toLocaleDateString('vi',{weekday:'long',day:'2-digit',month:'2-digit'}),dh=d!==lastD?`<div class="dh">${d}</div>`:'';lastD=d;
   const bd=`<span class="tag ${r.k==='deadline'?'t-todo':'t-doing'}">${r.k==='deadline'?'Hạn chót':'Cuộc họp'}</span><h3>${esc(r.t)}</h3><div class="ft"><span>${hm(r.ts)}</span><span style="margin-left:8px">${(r.who||[]).map(av).join('')}</span><span class="sp"></span>${r.virt?'':trash(r)}</div>`;
   return dh+(r.virt?`<div class="card">${bd}</div>`:card(r,bd))}).join('')+'</div>':'<div class="empty">Không có lịch</div>'}
 $('#body').innerHTML=h;translateWorkspace();
}

/* ===== Trình soạn thảo ===== */
function sum(c,r){const m=r.match(/SUM\(([A-Z])(\d+):([A-Z])(\d+)\)/);if(!m)return'';let t=0;for(let i=+m[2];i<=+m[4];i++)t+=parseFloat(c[m[1]+i])||0;return t}
function open(id){
 const d=S.docs.find(x=>x.id===id);if(!d)return;if(d.glink){window.open(d.glink,'_blank');return}let body;
 if(d.k==='doc')body=`<div class="page" contenteditable="true" id="pg">${d.html}</div>`;
 else{const c=d.cells,L='ABCDEF'.split('');body=`<div class="sh"><table><tr><th></th>${L.map(l=>`<th>${l}</th>`).join('')}</tr>${Array.from({length:14},(_,i)=>`<tr><th>${i+1}</th>${L.map(l=>{const k=l+(i+1),v=c[k]||'';return`<td contenteditable="true" data-k="${k}">${esc(v.startsWith('=')?sum(c,v):v)}</td>`}).join('')}</tr>`).join('')}</table></div>`}
 $('#modal').innerHTML=`<div class="ov"><div class="ed"><div class="edh"><svg class="i"><use href="#i-${d.k==='doc'?'file-text':'table'}"/></svg><b>${esc(d.t)}</b>${d.k==='doc'?'<button class="btn" data-a="fmt" data-v="bold"><b>B</b></button><button class="btn" data-a="fmt" data-v="italic"><i>I</i></button><button class="btn" data-a="fmt" data-v="insertUnorderedList"><svg class="i"><use href="#i-list"/></svg></button>':'<small style="color:var(--mu)">Gõ =SUM(B2:B3) để cộng</small>'}<button class="btn" data-a="close"><svg class="i"><use href="#i-x"/></svg></button></div>${body}</div></div>`;
 const el=$('.ed');let t;
 if(d.k==='doc')el.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{d.html=$('#pg').innerHTML;saveDoc(d)},400)});
 else{el.addEventListener('focusin',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&d.cells[k])e.target.textContent=d.cells[k]});
  el.addEventListener('focusout',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;const v=e.target.textContent.trim();if(v)d.cells[k]=v;else delete d.cells[k];e.target.textContent=v.startsWith('=')?sum(d.cells,v):v;saveDoc(d)})}
}

/* ===== @nhắc tên · bình luận · thông báo · chat riêng · lịch ===== */
const meId=()=>uid||ME.e,nIds=a=>a.map(m=>m.id||m.e);
const fdt=d=>new Date(d).toLocaleString('vi',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const pdt=s=>{s=s.trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?\s+(\d{1,2}):(\d{2})$/);if(m)return new Date(+(m[3]||new Date().getFullYear()),m[2]-1,m[1],m[4],m[5]);m=s.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})$/);return m?new Date(m[1],m[2]-1,m[3],m[4],m[5]):null};
let _mr,_mn=-1;const mre=()=>{if(_mn!==S.members.length){_mn=S.members.length;const a=S.members.map(m=>m.n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((x,y)=>y.length-x.length);_mr=a.length?new RegExp('@('+a.join('|')+')(?![\\p{L}\\d])','giu'):null}return _mr};
const fm=t=>{const r=mre(),h=esc(t);return r?h.replace(r,'<b class="mn">$&</b>'):h};
const mentions=t=>{const l=t.toLowerCase();return S.members.filter(m=>String(m.id||m.e)!==String(meId())&&l.includes('@'+m.n.toLowerCase()))};
const notify=(to,text,view)=>{to=[...new Set(to)].filter(x=>x&&String(x)!==String(meId()));if(!to.length)return;
 if(uid)sb.from('ws_notifs').insert(to.map(u=>({user_id:u,text,view}))).then(()=>{});else{to.forEach(u=>S.notifs.push({id:Date.now()+Math.random(),to:u,text,view,read:false,time:hm(new Date())}));save()}};
const myN=()=>S.notifs.filter(n=>uid||n.to===ME.e);
const remind=()=>{const o=[],now=Date.now(),me=String(meId());
 S.events.forEach(e=>{const t=new Date(e.at).getTime();if(e.ids&&e.ids.length&&!e.ids.map(String).includes(me))return;
  if(e.k==='meeting'&&t>now&&t-now<36e5)o.push({text:`⏰ ${e.t} bắt đầu lúc ${hm(e.at)}`,view:'events'});
  if(e.k==='deadline'&&t>now&&t-now<864e5)o.push({text:`⏳ Hạn chót trong 24h: ${e.t}`,view:'events'})});
 S.projects.forEach(p=>{const d=/^\d{4}-\d\d-\d\d/.test(p.due)?new Date(p.due+'T23:59:00').getTime():0;if(d&&p.st!=='done'&&d>now&&d-now<1728e5&&(p.who||[]).includes(ME.n))o.push({text:`⏳ Dự án “${p.t}” sắp tới hạn (${p.due})`,view:'projects'})});return o};
function bell(){const r=remind(),n=myN(),u=n.filter(x=>!x.read).length+r.length,b=$('#bn');if(b){b.textContent=u>99?'99+':u;b.style.display=u?'grid':'none'}
 $('#bpw').innerHTML=bellOpen?'<div class="bp"><div class="bar" style="margin:0"><b>Thông báo</b><span class="sp"></span><button class="btn" data-a="nread">Đọc hết</button></div>'+(r.map(x=>`<div class="it" data-a="nitem" data-v="${x.view}">${esc(x.text)}</div>`).join('')+n.slice().reverse().slice(0,30).map(x=>`<div class="it ${x.read?'':'un'}" data-a="nitem" data-v="${x.view||''}">${esc(x.text)}<small>${esc(x.time||'')}</small></div>`).join('')||'<div class="empty" style="padding:24px">Chưa có thông báo</div>')+'</div>':''}
const lastDm={};
function afterSend(b){const me=String(meId());
 if(ch.startsWith('dm:')){const o=ch.slice(3).split('|').find(x=>x!==me);if(o&&Date.now()-(lastDm[ch]||0)>3e5){lastDm[ch]=Date.now();notify([o],ME.n+' đã nhắn riêng cho bạn','chat')}}
 else notify(nIds(mentions(b)),`${ME.n} nhắc bạn trong #${ch}`,'chat')}

document.addEventListener('input',e=>{const t=e.target;if(t.id!=='ci'&&t.id!=='cmi')return;lastIn=t.id;const g=$('#sgw'),m=t.value.slice(0,t.selectionStart).match(/@([^\s@]*)$/);if(!m){g.innerHTML='';return}

const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,'');
const rm=ids=>{if(uid){sb.from('ws_'+view).delete().in('id',[...ids]).then(()=>{sel.clear();selMode=false;pop=false;pull()});return}const k=view;S[k]=S[k].filter(x=>!ids.has(x.id));log(`Đã xóa ${ids.size} mục`);sel.clear();selMode=false;pop=false;save();render()};
const A={
 nav(v){view=v;sel.clear();selMode=false;pop=false;qs='';$('#q').value='';render()},

 lang(){WSLANG=WSLANG==='vi'?'en':'vi';try{localStorage.setItem('hr_workspace_lang',WSLANG)}catch(e){}render();side()},

 pop(){pop=!pop;render()},selmode(){selMode=!selMode;pop=false;sel.clear();render()},
 ck(_,el){const id=+el.closest('.card').dataset.id;sel.has(id)?sel.delete(id):sel.add(id);render()},
 delsel(){if(sel.size&&confirm(`Xóa ${sel.size} mục đã chọn?`))rm(new Set(sel))},
 delall(){const n=list().length;pop=false;if(n&&confirm(`Xóa TẤT CẢ ${n} mục trong “${TT[view][0]}”? Không thể hoàn tác.`))rm(new Set(list().map(x=>x.id)));else render()},
 del1(_,el){const id=+el.closest('.card').dataset.id;if(confirm('Xóa mục này?'))rm(new Set([id]))},
 add(){const t=prompt('Tên dự án:');if(!t)return;const w=prompt('Giao cho (tên nhân viên, cách nhau dấu phẩy):',S.members[1].n)||'';S.projects.unshift({id:Date.now(),t,d:'Dự án mới được giao.',st:'todo',who:w.split(',').map(s=>s.trim()).filter(Boolean),pg:0,due:'—'});log(`Giao dự án “${t}” cho ${w}`);save();render()},
 adv(_,el){const p=S.projects.find(x=>x.id==el.closest('.card').dataset.id);p.st=p.st==='todo'?'doing':'done';p.pg=p.st==='done'?100:Math.max(p.pg,30);log(`“${p.t}” → ${ST[p.st]}`);save();render()},

 if(view==='projects')h+=`<div class="stats"><div class="st s0"><b>${P.length}</b><span>Tổng dự án</span></div><div class="st s1"><b>${P.filter(p=>p.st==='doing').length}</b><span>Đang làm</span></div><div class="st s2"><b>${P.filter(p=>p.st==='todo').length}</b><span>Chờ</span></div><div class="st s3"><b>${P.filter(p=>p.st==='done').length}</b><span>Hoàn thành</span></div></div>${bar}`+(list().length?`<div class="grid">${list().map(p=>{const w=p.who||[];return xcard(p,p.st,xhead('layout-kanban',p.t,`Hạn ${esc(fdd(p.due))} · ${p.pg}% hoàn thành`)+`<div class="xx"><div><div class="in"><p>${esc(p.d)}</p><div class="pg"><i style="width:${p.pg}%;background:var(--c)"></i></div><div class="tg"><span class="tag t-${p.st}">${sC[p.st]}</span><span class="tag t-doc">${I('calendar')}${esc(fdd(p.due))}</span></div></div></div></div><div class="xf"><span style="display:flex">${w.map(av).join('')}</span><span style="margin-left:10px"><b style="color:var(--tx)">${w.length}</b> thành viên</span><span class="sp"></span><button class="ic cm" data-a="cm" data-v="project" title="Bình luận">${I('messages')}${cmN('project',p.id)||''}</button>${p.st!=='done'?`<button class="ic" data-a="adv" title="Chuyển trạng thái" style="color:var(--ac)">${I('arrow-right')}</button>`:''}${trash(p)}</div>`)}).join('')}</div>`:'<div class="empty">Chưa có dự án</div>');
 if(view==='goals')h+=bar.replace('<span class="sp"></span>',`<span class="sp"></span><button class="btn p" data-a="gadd">${I('plus')} Đặt mục tiêu</button>`)+(list().length?`<div class="grid gg">${list().map(gcard).join('')}</div>`:'<div class="empty">Chưa có mục tiêu — hãy đặt mục tiêu đầu tiên</div>');
 if(view==='events'){const now=Date.now();let rows=S.events.filter(e=>!qs||e.t.toLowerCase().includes(qs)).map(e=>({...e,ts:new Date(e.at).getTime()}));if(!qs)P.forEach(p=>{if(/^\d{4}-\d\d-\d\d/.test(p.due))rows.push({virt:1,t:'Hạn dự án: '+p.t,k:'deadline',ts:new Date(p.due+'T23:59:00').getTime(),who:p.who||[]})});
  rows=rows.filter(r=>evf==='up'?r.ts>=now-36e5:r.ts<now-36e5).sort((x,y)=>evf==='up'?x.ts-y.ts:y.ts-x.ts);
  h+=bar+(rows.length?'<div style="display:flex;flex-direction:column;gap:14px">'+rows.map(r=>r.k==='meeting'&&!r.virt?mcard(r):`<div class="card xc todo" style="max-width:580px"${r.virt?'':` data-id="${r.id}"`}><div class="xh"><span class="xi">${I('flag')}</span><div class="xt"><h3>${esc(r.t)}</h3><small>Hạn chót · ${fdt(r.ts)}</small></div>${r.virt?'':trash(r)}</div></div>`).join('')+'</div>':'<div class="empty">Chưa có lịch họp</div>')}
 $('#body').innerHTML=h;translateWorkspace()};
/* ---- cổng đăng nhập (hình 1-2, màu đồng bộ hình 6) ---- */
loginUI=function(msg){$('#modal').innerHTML=`<div class="lg"><svg class="sw" viewBox="0 0 1200 800" preserveAspectRatio="none" fill="none"><path d="M-50 640C250 420 480 780 780 540S1100 240 1260 320" stroke="rgba(190,220,255,.45)" stroke-width="2"/><path d="M-50 700C260 500 520 820 820 590S1120 330 1260 400" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/><path d="M-50 120C200 260 420 20 700 160S1000 80 1260 -20" stroke="rgba(190,220,255,.3)" stroke-width="1.5"/></svg>
<div class="lp"><div class="lv"><div class="fc" id="fc"><div class="fi"><div class="ff"><div class="fr"><span class="logo">HR</span><b>Workspace</b><em>Thẻ nhân sự</em></div><div class="cp"></div><div class="fn" id="fn">Tên của bạn</div><div class="fm"><div><small>Tài khoản</small><b id="fe">email@congty.vn</b></div><div><small>Quyền</small><b>Nội bộ</b></div></div></div><div class="fb"><div class="strip"></div><div class="sig"><small>Mật khẩu</small><span id="fd">•••</span></div><p>Thẻ lật để bạn kiểm tra số ký tự đã nhập. Mật khẩu không bao giờ hiển thị.</p></div></div></div>
<button class="chip" data-a="lgflip" style="background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)">Lật thẻ</button><div class="bd2"><span>🔒 Kết nối mã hóa</span><span>🛡 Chỉ tài khoản công ty cấp</span></div></div>
<div class="lf"><h2>Đăng nhập không gian làm việc</h2><p>Dùng tài khoản do công ty cấp.</p><div class="ok2"><i></i>Hệ thống đang hoạt động</div>
<label class="fld">${I('mail')}<input id="le" placeholder="Email công ty" autocomplete="username"></label><label class="fld">${I('lock')}<input id="lp" type="password" placeholder="Mật khẩu" autocomplete="current-password"><button type="button" data-a="lgeye" title="Hiện / ẩn mật khẩu">${I('screen')}</button></label>
<div id="lerr" style="color:#ffd1d1;font-size:12.5px;min-height:18px;margin-bottom:6px">${esc(msg||'')}</div><button class="go" data-a="plogin">Đăng nhập ${I('arrow-right')}</button><button class="go2" data-a="glogin">Đăng nhập bằng Google</button>
<div class="ft2"><a href="#" data-a="demo">Xem bản demo</a><a href="${PORTAL_URL}">Về HR Portal</a></div></div></div></div>`};
A.lgflip=()=>$('#fc').classList.toggle('flip');A.lgeye=()=>{const p=$('#lp');p.type=p.type==='password'?'text':'password'};
document.addEventListener('input',e=>{const t=e.target;if(t.id==='le'){const v=t.value.trim(),n=v.split('@')[0].replace(/[._-]+/g,' ');$('#fn').textContent=n?n.replace(/(^|\s)\p{L}/gu,c=>c.toUpperCase()):'Tên của bạn';$('#fe').textContent=v||'email@congty.vn'}if(t.id==='lp')$('#fd').textContent='•'.repeat(Math.min(t.value.length,16))||'•••'});
document.addEventListener('focusin',e=>{const f=$('#fc');if(f)f.classList.toggle('flip',e.target.id==='lp')});
})();

fit();render();watchWorkspaceLanguage();boot();
</script></body></html>
