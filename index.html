<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CANVIO — Canva + PPT Morph Studio</title>
<!-- Thư viện Konva.js cho Canvas 2D -->
<script src="https://unpkg.com/konva@9/konva.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#172b43;--surface:#f5f7fa;--line:#e7ebf0;--ink:#17202c}
  *{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;height:100vh}
  header{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .brand{font:800 18px Manrope;letter-spacing:1.5px;color:var(--navy)}
  .toolbar{display:flex;gap:10px;align-items:center}
  button{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;transition:.2s}
  button:hover{opacity:.9}
  button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .main-container{flex:1;display:grid;grid-template-columns:300px 1fr;overflow:hidden}
  .sidebar{background:#fff;border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:15px}
  .sidebar h3{font:800 14px Manrope;margin:0}
  .slide-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1}
  .slide-thumb{padding:12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fafbfc;font-size:12px;font-weight:700}
  .slide-thumb.active{border-color:var(--navy);background:#edf2f7}
  .stage-area{display:grid;place-items:center;padding:20px;overflow:auto;background:#eef2f6}
  #konva-stage-container{background:#fff;box-shadow:0 15px 40px #00000010;border-radius:12px;overflow:hidden}
</style>
</head>
<body>

<header>
  <div class="brand">✦ CANVIO STUDIO</div>
  <div class="toolbar">
    <span id="slide-indicator" style="font-size:12px; font-weight:700; margin-right:10px;">Slide 1 / 2</span>
    <button class="secondary" id="btn-prev">‹ Trước</button>
    <button id="btn-play-morph">✨ Chạy Morph & Fade</button>
    <button class="secondary" id="btn-next">Sau ›</button>
  </div>
</header>

<div class="main-container">
  <aside class="sidebar">
    <h3>Quản lý Slide</h3>
    <p style="font-size:11px;color:#666;margin:0">Chọn slide để xem hoặc cấu hình chuyển cảnh.</p>
    <div class="slide-list" id="slide-list">
      <!-- Danh sách slide render bằng JS -->
    </div>
  </aside>
  <main class="stage-area">
    <div id="konva-stage-container"></div>
  </main>
</div>

<script>
// Cấu trúc dữ liệu dự án mẫu (Mỗi slide chứa các phần tử có chung morphId để chạy hiệu ứng Morph)
const projectData = {
  slides: [
    {
      id: "slide_1",
      background: "#172b43",
      elements: [
        { morphId: "title", type: "text", text: "ALEX MORGAN", x: 60, y: 100, fontSize: 38, fill: "#ffffff", width: 500 },
        { morphId: "role", type: "text", text: "HR Specialist & Creative Professional", x: 60, y: 155, fontSize: 16, fill: "#c6a77b", width: 400 },
        { morphId: "card", type: "rect", x: 60, y: 220, width: 200, height: 200, fill: "#25415f", cornerRadius: 16 }
      ]
    },
    {
      id: "slide_2",
      background: "#f8fafc",
      elements: [
        { morphId: "title", type: "text", text: "ALEX MORGAN", x: 400, y: 60, fontSize: 22, fill: "#172b43", width: 300 },
        { morphId: "role", type: "text", text: "HR Specialist & Creative Professional", x: 400, y: 90, fontSize: 12, fill: "#7e8997", width: 300 },
        { morphId: "card", type: "rect", x: 60, y: 60, width: 310, height: 400, fill: "#c6a77b", cornerRadius: 12 }
      ]
    }
  ]
};

class CanvioMorphEngine {
  constructor(containerId, width, height) {
    this.stage = new Konva.Stage({ container: containerId, width, height });
    this.layer = new Konva.Layer();
    this.stage.add(this.layer);
    this.currentIdx = 0;
  }

  loadSlide(index, animateIn = false) {
    this.currentIdx = index;
    this.layer.destroyChildren();
    const slide = projectData.slides[index];
    if (!slide) return;

    // Nền slide
    const bg = new Konva.Rect({ x: 0, y: 0, width: this.stage.width(), height: this.stage.height(), fill: slide.background });
    this.layer.add(bg);

    slide.elements.forEach((el, i) => {
      let node;
      const initAlpha = animateIn ? 0 : 1;
      const initY = animateIn ? el.y + 15 : el.y;

      const cfg = { ...el, y: initY, opacity: initAlpha, name: el.morphId };
      if (el.type === 'text') node = new Konva.Text(cfg);
      else if (el.type === 'rect') node = new Konva.Rect(cfg);

      if (node) {
        this.layer.add(node);
        if (animateIn) {
          new Konva.Tween({ node, duration: 0.7, y: el.y, opacity: 1, easing: Konva.Easings.EaseOut, delay: i * 0.08 }).play();
        }
      }
    });
    this.layer.draw();
    updateUIState();
  }

  morphTo(targetIndex) {
    const toSlide = projectData.slides[targetIndex];
    if (!toSlide) return;

    const existingNodes = this.layer.getChildren().filter(n => n.name());

    // 1. Morph các phần tử cũ sang vị trí/thuộc tính mới ở slide đích
    existingNodes.forEach(node => {
      const target = toSlide.elements.find(e => e.morphId === node.name());
      if (target) {
        new Konva.Tween({
          node, duration: 1.0, easing: Konva.Easings.EaseInOut,
          x: target.x, y: target.y, width: target.width, height: target.height,
          fill: target.fill, fontSize: target.fontSize || node.fontSize(), opacity: 1
        }).play();
      } else {
        new Konva.Tween({ node, duration: 0.4, opacity: 0 }).play();
      }
    });

    // 2. Fade-in các phần tử hoàn toàn mới xuất hiện ở slide đích
    toSlide.elements.forEach((target, i) => {
      const existed = existingNodes.some(n => n.name() === target.morphId);
      if (!existed) {
        let newNode;
        const cfg = { ...target, opacity: 0, y: target.y + 20, name: target.morphId };
        if (target.type === 'text') newNode = new Konva.Text(cfg);
        else if (target.type === 'rect') newNode = new Konva.Rect(cfg);

        if (newNode) {
          this.layer.add(newNode);
          new Konva.Tween({ node: newNode, duration: 0.8, y: target.y, opacity: 1, easing: Konva.Easings.EaseOut, delay: 0.3 + (i * 0.1) }).play();
        }
      }
    });

    // Morph màu nền
    const bgNode = this.layer.getChildren()[0];
    if (bgNode) {
      new Konva.Tween({ node: bgNode, duration: 1.0, fill: toSlide.background }).play();
    }

    this.currentIdx = targetIndex;
    updateUIState();
  }
}

// Khởi tạo ứng dụng
const engine = new CanvioMorphEngine("konva-stage-container", 720, 520);
engine.loadSlide(0, false);

function updateUIState() {
  document.getElementById("slide-indicator").textContent = `Slide ${engine.currentIdx + 1} / ${projectData.slides.length}`;
  document.querySelectorAll(".slide-thumb").forEach((el, idx) => {
    el.classList.toggle("active", idx === engine.currentIdx);
  });
}

// Render danh sách slide ở Sidebar
const listEl = document.getElementById("slide-list");
projectData.slides.forEach((s, idx) => {
  const item = document.createElement("div");
  item.className = `slide-thumb ${idx === 0 ? 'active' : ''}`;
  item.textContent = `Slide ${idx + 1} (${s.id})`;
  item.onclick = () => engine.morphTo(idx);
  listEl.appendChild(item);
});

// Gắn sự kiện nút bấm
document.getElementById("btn-prev").onclick = () => {
  if (engine.currentIdx > 0) engine.morphTo(engine.currentIdx - 1);
};
document.getElementById("btn-next").onclick = () => {
  if (engine.currentIdx < projectData.slides.length - 1) engine.morphTo(engine.currentIdx + 1);
};
document.getElementById("btn-play-morph").onclick = () => {
  let next = (engine.currentIdx + 1) % projectData.slides.length;
  engine.morphTo(next);
};
</script>
</body>
</html>
