<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORMA — Professional Creative Career Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/konva@9/konva.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #172b43; --navy2: #25415f; --ink: #17202c; --muted: #7e8997;
    --line: #e7ebf0; --surface: #f5f7fa; --gold: #c6a77b; --green: #287c60;
    --radius: 12px; --shadow: 0 15px 35px rgba(23,43,67,0.08);
  }
  *{box-sizing:border-box} body{margin:0;background:var(--surface);color:var(--ink);font-family:'DM Sans',sans-serif;height:100vh;overflow:hidden}
  .hidden{display:none!important} button{cursor:pointer;font-family:inherit;transition:all .2s} button:disabled{opacity:.5;cursor:not-allowed}

  /* AUTH MODAL & OVERLAY */
  #auth-overlay{position:fixed;inset:0;background:rgba(23,43,67,0.8);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:999}
  .auth-card{background:#fff;padding:36px;border-radius:16px;width:100%;max-width:400px;box-shadow:var(--shadow)}
  .auth-card h2{font:800 24px Manrope;margin:0 0 6px;color:var(--navy)}
  .field{margin:14px 0} .field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px}
  .field input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;outline:none}
  .btn-primary{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:700}
  .btn-primary:hover{background:var(--navy2)}
  .btn-secondary{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 16px;font-weight:700}

  /* MAIN APP LAYOUT */
  #app{display:flex;height:100vh}
  .sidebar{width:260px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:8px}
  .brand{font:800 20px Manrope;letter-spacing:1px;color:var(--navy);display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .brand-symbol{width:32px;height:32px;background:var(--navy);color:#fff;border-radius:8px;display:grid;place-items:center;font-weight:800}
  .nav-btn{width:100%;background:none;border:0;text-align:left;padding:11px 14px;border-radius:9px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:10px}
  .nav-btn.active,.nav-btn:hover{background:#edf2f7;color:var(--navy)}
  
  .main-stage{flex:1;display:flex;flex-direction:column;overflow:hidden}
  header{height:65px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}
  .page{display:none;flex:1;padding:30px;overflow-y:auto} .page.active{display:block}

  /* TEMPLATE GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
  .card:hover{transform:translateY(-3px)}
  .card-thumb{height:160px;display:grid;place-items:center;color:#fff;font:800 16px Manrope;padding:20px;text-align:center}
  .card-body{padding:16px} .card-body h4{margin:0 0 6px;font-size:15px} .card-body p{margin:0;font-size:12px;color:var(--muted)}

  /* STUDIO EDITOR */
  .studio-layout{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 65px)}
  .studio-panel{background:#fff;border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px}
  .canvas-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#eef2f6;position:relative;padding:20px}
  #konva-holder{background:#fff;box-shadow:0 20px 50px rgba(0,0,0,0.1);border-radius:12px;overflow:hidden}
  .timeline-bar{position:absolute;bottom:25px;background:#fff;border:1px solid var(--line);padding:8px 20px;border-radius:30px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
  .slide-dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;cursor:pointer}
  .slide-dot.active{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>
</head>
<body>

<!-- 1. AUTH SYSTEM (Kết Nối Supabase Auth) -->
<div id="auth-overlay">
  <div class="auth-card">
    <div class="brand"><span class="brand-symbol">F</span> FORMA</div>
    <h2>Đăng Nhập Studio</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:20px">Tạo & Quản lý thiết kế trên Cloud.</p>
    <form id="auth-form">
      <div class="field"><label>Email</label><input id="email" type="email" value="demo@forma.ai" required></div>
      <div class="field"><label>Mật khẩu</label><input id="password" type="password" value="123456" required></div>
      <button class="btn-primary" style="width:100%" type="submit">Vào Studio →</button>
      <p id="auth-msg" style="font-size:11px;color:red;margin-top:10px;text-align:center"></p>
    </form>
  </div>
</div>

<!-- 2. MAIN APPLICATION -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand"><span class="brand-symbol">F</span> FORMA</div>
    <button class="nav-btn active" data-page="dashboard">🏠 Dashboard</button>
    <button class="nav-btn" data-page="templates">📂 Kho Mẫu Pro (10 Slides)</button>
    <div style="margin-top:auto;font-size:11px;color:var(--muted);padding:10px">Acc: <span id="user-display">---</span></div>
  </aside>

  <main class="main-stage">
    <header>
      <strong id="header-title">FORMA Workspace</strong>
      <button class="btn-secondary" id="btn-save-cloud">☁️ Lưu Bản Thiết Kế (Supabase)</button>
    </header>

    <!-- Trang Dashboard -->
    <section class="page active" id="page-dashboard">
      <h2>Dự Án Động Nổi Bật</h2>
      <p style="font-size:13px;color:var(--muted)">Chọn mẫu thiết kế chuyên nghiệp với chuỗi trình chiếu Morph 10 trang liền mạch.</p>
      <div class="grid" id="dash-grid"></div>
    </section>

    <!-- Trang Kho Mẫu -->
    <section class="page" id="page-templates">
      <h2>Thư Viện Mẫu 10 Slide</h2>
      <div class="grid" id="gallery-grid"></div>
    </section>

    <!-- Trang Studio Editor (Canvas Morph & Animation) -->
    <section class="page" id="page-editor" style="padding:0">
      <div class="studio-layout">
        <aside class="studio-panel">
          <h3 id="tpl-name" style="margin:0">Mẫu Thiết Kế</h3>
          <p style="font-size:11px;color:var(--muted);margin:0">Tự động Morph giữa 10 Slide với các Animation khác nhau.</p>
          <hr style="border:0;border-top:1px solid var(--line)">
          <button class="btn-secondary" onclick="navigate('dashboard')">← Trở về Dashboard</button>
          <div id="slide-list-preview" style="display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1"></div>
        </aside>

        <main class="canvas-stage">
          <div id="konva-holder"></div>
          <div class="timeline-bar">
            <button class="btn-secondary" id="btn-prev-slide" style="padding:4px 10px">‹</button>
            <div id="slide-dots" style="display:flex;gap:4px"></div>
            <button class="btn-secondary" id="btn-next-slide" style="padding:4px 10px">›</button>
            <button class="btn-primary" id="btn-play-all" style="padding:6px 14px;background:var(--green)">▶ Auto Play (10 Trang)</button>
          </div>
        </main>
      </div>
    </section>
  </main>
</div>

<script>
/* 1. SUPABASE CLIENT CONFIG (Dùng bảng designs vừa tạo) */
const CONFIG = {
  URL: "https://tjrbuixjmcgqgfxzdswi.supabase.co",
  KEY: "sb_publishable_NzJCKHCmcXobu1KNMW3x9A_hL4-8gvy"
};
const db = window.supabase?.createClient(CONFIG.URL, CONFIG.KEY);
let currentUser = null, activeDesignData = null;

/* 2. THƯ VIỆN MẪU PRO 10 SLIDES CHO CV, PORTFOLIO & POSTER */
function generate10Slides(type, title, primaryColor) {
  const slides = [];
  for (let i = 1; i <= 10; i++) {
    slides.push({
      id: `slide_${i}`,
      background: i % 2 === 1 ? primaryColor : "#ffffff",
      elements: [
        { morphId: "header_title", type: "text", text: `${title.toUpperCase()}`, x: i % 2 === 1 ? 50 : 380, y: 40, fontSize: i % 2 === 1 ? 28 : 20, fill: i % 2 === 1 ? "#ffffff" : primaryColor },
        { morphId: "page_num", type: "text", text: `0${i} / 10`, x: 620, y: 40, fontSize: 14, fill: i % 2 === 1 ? "#c6a77b" : "#7e8997" },
        { morphId: "main_card", type: "rect", x: i % 2 === 1 ? 50 : 50, y: 100, width: i % 2 === 1 ? 220 : 300, height: 320, fill: i % 2 === 1 ? "#ffffff20" : primaryColor, cornerRadius: 12 },
        { morphId: "content_body", type: "text", text: `Trang ${i}: Trình bày chi tiết ${type === 'cv' ? 'Kinh nghiệm & Kỹ năng' : type === 'portfolio' ? 'Dự án nổi bật' : 'Thông tin chiến dịch'}`, x: i % 2 === 1 ? 300 : 380, y: 120, fontSize: 14, fill: i % 2 === 1 ? "#ffffff" : "#17202c", width: 300 }
      ]
    });
  }
  return slides;
}

const templatesPro = [
  { id: "cv_executive_10", name: "Executive 10-Page Master CV", type: "cv", color: "#172b43", slides: generate10Slides("cv", "Executive CV", "#172b43") },
  { id: "portfolio_agency_10", name: "Agency Interactive Portfolio", type: "portfolio", color: "#25415f", slides: generate10Slides("portfolio", "Creative Portfolio", "#25415f") },
  { id: "poster_campaign_10", name: "Hiring Campaign 10-Slide Deck", type: "poster", color: "#287c60", slides: generate10Slides("poster", "Recruitment Campaign", "#287c60") }
];

/* 3. AUTHENTICATION & DATABASE SYNC */
document.getElementById("auth-form").onsubmit = async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    if (db) {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        const { data: signData, error: signErr } = await db.auth.signUp({ email, password });
        if (signErr) throw signErr;
        currentUser = signData.user;
      } else {
        currentUser = data.user;
      }
    }
  } catch (err) {
    console.warn("Auth Fallback Local Mode:", err.message);
    currentUser = { id: "local-user-id", email };
  }
  document.getElementById("auth-overlay").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("user-display").textContent = currentUser?.email || email;
  renderGrids();
};

document.getElementById("btn-save-cloud").onclick = async () => {
  if (!activeDesignData) return alert("Vui lòng chọn một mẫu để lưu!");
  if (!db || !currentUser?.id) return alert("Đã lưu ở chế độ Local!");

  const payload = {
    user_id: currentUser.id,
    title: activeDesignData.name,
    design_type: activeDesignData.type,
    status: "draft",
    content: { slides: activeDesignData.slides }
  };

  const { error } = await db.from("designs").insert([payload]);
  if (error) alert("Lỗi khi lưu Supabase: " + error.message);
  else alert("✨ Đã lưu thiết kế và 10 Slides vào Supabase Database!");
};

/* 4. NAVIGATION & UI RENDERING */
function navigate(pageId) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(n => n.classList.remove("active"));
  document.getElementById("page-" + pageId).classList.add("active");
}
document.querySelectorAll(".nav-btn[data-page]").forEach(b => b.onclick = () => navigate(b.dataset.page));

function renderGrids() {
  const html = templatesPro.map(t => `
    <div class="card" onclick="openStudio('${t.id}')">
      <div class="card-thumb" style="background:${t.color}">${t.name}</div>
      <div class="card-body">
        <h4>${t.name}</h4>
        <p>${t.type.toUpperCase()} · 10 Slide Morph Animation</p>
      </div>
    </div>
  `).join("");
  document.getElementById("dash-grid").innerHTML = html;
  document.getElementById("gallery-grid").innerHTML = html;
}

/* 5. KONVA MORPH ENGINE (10 SLIDES AUTO PRESENTATION) */
let studioEngine = null;

function openStudio(tplId) {
  activeDesignData = templatesPro.find(t => t.id === tplId);
  if (!activeDesignData) return;
  navigate("editor");
  document.getElementById("tpl-name").textContent = activeDesignData.name;

  if (studioEngine) studioEngine.stage.destroy();
  studioEngine = new MorphStudioEngine("konva-holder", 700, 460, activeDesignData);
}

class MorphStudioEngine {
  constructor(containerId, width, height, data) {
    this.stage = new Konva.Stage({ container: containerId, width, height });
    this.layer = new Konva.Layer();
    this.stage.add(this.layer);
    this.data = data;
    this.currentIdx = 0;
    this.autoTimer = null;

    this.renderDots();
    this.loadSlide(0);

    document.getElementById("btn-next-slide").onclick = () => this.next();
    document.getElementById("btn-prev-slide").onclick = () => this.prev();
    document.getElementById("btn-play-all").onclick = () => this.playContinuous();
  }

  renderDots() {
    const dotsHolder = document.getElementById("slide-dots");
    dotsHolder.innerHTML = this.data.slides.map((_, i) => `
      <div class="slide-dot ${i === 0 ? 'active' : ''}" onclick="studioEngine.morphTo(${i})">${i + 1}</div>
    `).join("");

    const previewList = document.getElementById("slide-list-preview");
    previewList.innerHTML = this.data.slides.map((s, i) => `
      <div class="btn-secondary" style="font-size:11px;padding:8px" onclick="studioEngine.morphTo(${i})">Slide ${i + 1} (${s.id})</div>
    `).join("");
  }

  loadSlide(idx) {
    this.currentIdx = idx;
    this.layer.destroyChildren();
    const slide = this.data.slides[idx];

    const bg = new Konva.Rect({ x: 0, y: 0, width: this.stage.width(), height: this.stage.height(), fill: slide.background });
    this.layer.add(bg);

    slide.elements.forEach(el => {
      let node;
      const cfg = { ...el, name: el.morphId };
      if (el.type === 'text') node = new Konva.Text(cfg);
      else if (el.type === 'rect') node = new Konva.Rect(cfg);
      if (node) this.layer.add(node);
    });
    this.layer.draw();
    this.updateUI();
  }

  next() { this.morphTo((this.currentIdx + 1) % this.data.slides.length); }
  prev() { this.morphTo((this.currentIdx - 1 + this.data.slides.length) % this.data.slides.length); }

  morphTo(targetIdx) {
    const toSlide = this.data.slides[targetIdx];
    const existingNodes = this.layer.getChildren().filter(n => n.name());

    existingNodes.forEach(node => {
      const target = toSlide.elements.find(e => e.morphId === node.name());
      if (target) {
        new Konva.Tween({
          node, duration: 0.8, easing: Konva.Easings.EaseInOut,
          x: target.x, y: target.y, width: target.width, height: target.height,
          fill: target.fill, fontSize: target.fontSize || node.fontSize()
        }).play();
      } else {
        new Konva.Tween({ node, duration: 0.3, opacity: 0 }).play();
      }
    });

    const bgNode = this.layer.getChildren()[0];
    if (bgNode) {
      new Konva.Tween({ node: bgNode, duration: 0.8, fill: toSlide.background }).play();
    }

    this.currentIdx = targetIdx;
    this.updateUI();
  }

  playContinuous() {
    clearInterval(this.autoTimer);
    let step = 0;
    this.autoTimer = setInterval(() => {
      step = (this.currentIdx + 1) % this.data.slides.length;
      this.morphTo(step);
      if (step === 9) clearInterval(this.autoTimer); // Trình diễn đủ 10 trang
    }, 1200);
  }

  updateUI() {
    document.querySelectorAll(".slide-dot").forEach((d, i) => {
      d.classList.toggle("active", i === this.currentIdx);
    });
  }
}
</script>
</body>
</html>
